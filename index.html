<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1ED">
<title>排砖预览 · 卫生间墙地砖排版</title>
<style>
/* ---------- 主题色板（浅色为基准，深色自动切换） ---------- */
:root{
  --paper:#F2F1ED;      /* 页面底色：暖石灰白 */
  --card:#FFFFFF;       /* 卡片底 */
  --ink:#26292E;        /* 正文 */
  --ink-soft:#6A6F76;   /* 次要文字 */
  --line:#DFDCD4;       /* 边框 */
  --chip:#ECEAE4;       /* 未选中的选项块 */
  --tile:#DAD6CE;       /* 砖块（图上） */
  --joint:#FFFFFF;      /* 砖缝（图上） */
  --r3d-joint:#8B8D90;  /* 砖缝（三维图上）：用中性灰，避免低分辨率下出现亮白格子 */
  --column:#C9B8A2;     /* 包管立柱（图上） */
  --open:#F3F1EC;       /* 门窗洞口底色（图上） */
  --accent:#2B5E9B;     /* 操作蓝：墨斗线 */
  --accent-soft:#E3EBF5;
  --ok:#2E7D46;         /* 成功绿 */
  --ok-soft:#E4F0E7;
  --warn:#B26205;       /* 提醒橙 */
  --warn-soft:#F7EBDA;
  --danger:#C0362C;     /* 错误红 */
  --danger-soft:#F8E4E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181B; --card:#202226; --ink:#ECEDEF; --ink-soft:#9CA2AA;
    --line:#34373D; --chip:#2A2D32; --tile:#4A4E55; --joint:#1B1C20; --r3d-joint:#2D3138;
    --column:#6E6050; --open:#1B1C20;
    --accent:#7FA9DC; --accent-soft:#243246;
    --ok:#74C28C; --ok-soft:#1F3327;
    --warn:#E2A44E; --warn-soft:#3A2E1B;
    --danger:#E5796F; --danger-soft:#3C2320;
  }
}
:root[data-theme="dark"]{
  --paper:#17181B; --card:#202226; --ink:#ECEDEF; --ink-soft:#9CA2AA;
  --line:#34373D; --chip:#2A2D32; --tile:#4A4E55; --joint:#1B1C20; --r3d-joint:#2D3138;
  --column:#6E6050; --open:#1B1C20;
  --accent:#7FA9DC; --accent-soft:#243246;
  --ok:#74C28C; --ok-soft:#1F3327;
  --warn:#E2A44E; --warn-soft:#3A2E1B;
  --danger:#E5796F; --danger-soft:#3C2320;
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:16px; line-height:1.5;
}
.wrap{max-width:560px; margin:0 auto; padding:0 14px calc(40px + env(safe-area-inset-bottom));}
input,button,select{font:inherit; color:inherit}
input{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%; min-height:44px; font-variant-numeric:tabular-nums;}
input:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent)}
button{cursor:pointer; touch-action:manipulation}

/* ---------- 页头 ---------- */
.app-head{padding:20px 2px 10px}
.app-head h1{margin:0; font-size:24px; font-weight:800; letter-spacing:.5px}
.app-head p{margin:2px 0 0; color:var(--ink-soft); font-size:13px}

/* 图例 */
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin:10px 2px 14px; font-size:12px; color:var(--ink-soft)}
.legend .lg{display:inline-flex; align-items:center; gap:6px}
.legend i{font-style:normal; display:inline-flex; align-items:center; justify-content:center; border-radius:5px; box-sizing:border-box}
.sw-cut{background:#fff; color:var(--danger); border:1px solid var(--danger); font-weight:700; font-size:11px; min-width:28px; height:18px; padding:0 4px}
.sw-edge{background:var(--accent); color:#fff; font-weight:700; font-size:11px; width:20px; height:18px}
.sw-col{width:16px; height:14px; background:linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 32%, rgba(0,0,0,0) 68%, rgba(0,0,0,.22)), var(--column); border:1px solid var(--line)}
.sw-open{width:16px; height:14px; background:var(--open); border:1px dashed var(--ink-soft)}

/* ---------- 顶部设置区（吸顶、可收起） ---------- */
.settings{position:sticky; top:0; z-index:20; margin:0 -14px; padding:0 14px; background:var(--paper);}
.settings-box{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.settings-toggle{display:flex; align-items:center; gap:8px; width:100%; min-height:48px; padding:10px 14px; background:none; border:none; text-align:left;}
.settings-summary{flex:1; min-width:0; font-size:14px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.settings-summary b{font-weight:700}
.chev{color:var(--ink-soft); transition:transform .15s; font-size:12px}
.settings.open .chev{transform:rotate(180deg)}
.settings-body{display:none; border-top:1px solid var(--line); padding:12px 14px 14px;}
.settings.open .settings-body{display:block}
.set-row{margin-bottom:14px}
.set-row:last-child{margin-bottom:0}
.set-label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.3px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--chip); border-radius:8px; padding:8px 12px; min-height:42px; font-size:15px; font-variant-numeric:tabular-nums;}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700}
.custom-inputs{display:none; gap:8px; margin-top:8px}
.custom-inputs.show{display:flex}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{flex:1; min-width:52px; min-height:42px; padding:0 6px; border:1px solid var(--line); background:var(--chip); border-radius:8px; font-size:14px}
.seg button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700}

/* ---------- 卡片 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px;}
.card-head{display:flex; align-items:center; gap:8px}
.card-name{flex:1; border:none; background:none; padding:4px 0; min-height:40px; font-size:18px; font-weight:800;}
.card-name:focus{outline:2px solid var(--accent); border-radius:6px}
.icon-btn{flex:none; width:40px; height:40px; border:1px solid var(--line); background:var(--chip); border-radius:8px; font-size:15px; color:var(--ink-soft)}
.icon-btn:active{background:var(--danger-soft); color:var(--danger); border-color:var(--danger)}
.card-sub{margin:0 0 10px; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.dim-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.dim-grid .field, .feat-inputs .field{min-width:0}
.field{display:block}
.field>span{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:3px}
.field.mini{flex:1; min-width:0}
.field.mini>span{font-size:11px}
.field.mini input{min-height:40px; padding:7px 8px; font-size:15px}

/* 门 / 窗 / 立柱 折叠区 */
.feat{margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.feat summary{display:flex; align-items:center; gap:8px; list-style:none; padding:10px 12px; min-height:44px; background:var(--chip); font-size:15px; font-weight:700; cursor:pointer}
.feat summary::-webkit-details-marker{display:none}
.feat summary::after{content:"▾"; margin-left:auto; color:var(--ink-soft); font-size:12px}
.feat[open] summary::after{transform:rotate(180deg)}
.feat-val{margin-left:2px; font-size:12px; font-weight:400; color:var(--ink-soft)}
.feat-val.lit{color:var(--accent); font-weight:700}
.feat-body{padding:12px; display:flex; flex-direction:column; gap:10px}
.switch-row{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:32px; font-size:15px}
.switch{appearance:none; -webkit-appearance:none; flex:none; width:52px; height:30px; border-radius:15px; background:var(--line); position:relative; transition:background .15s; border:none; min-height:0; padding:0}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:25px}
.feat-inputs{display:none; grid-template-columns:1fr 1fr; gap:8px}
.feat-inputs.show{display:grid}
.feat-inputs .wide{grid-column:1 / -1}
.col-row{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px}
.col-top{display:flex; align-items:center; gap:8px}
.col-tag{flex:none; font-size:12px; color:var(--ink-soft); font-weight:700}
.seg.mini{gap:4px}
.seg.mini button{flex:0 1 auto; min-width:0; min-height:30px; padding:0 9px; font-size:12px; border-radius:7px}
.mini-add{border:1px dashed var(--accent); color:var(--accent); background:none; border-radius:8px; min-height:42px; font-size:14px; font-weight:700}
.align-row{margin-top:10px}
.align-row .set-label{margin-bottom:6px}

/* 状态提示 */
.statuses{margin-top:10px; display:flex; flex-direction:column; gap:6px}
.st{font-size:13px; padding:7px 10px; border-radius:8px; line-height:1.45}
.st.ok{color:var(--ok); background:var(--ok-soft)}
.st.warn{color:var(--warn); background:var(--warn-soft)}
.st.error{color:var(--danger); background:var(--danger-soft)}
.st.info{color:var(--ink-soft); background:var(--chip)}

/* 示意图 */
.plot{margin-top:10px; background:var(--card); display:flex; justify-content:center}
.plot canvas{display:block; max-width:100%}
.plot-empty{margin:6px 0 2px; font-size:13px; color:var(--ink-soft); text-align:center}

/* 增加墙 / 地面 */
.add-row{display:flex; gap:10px; margin-top:16px}
.room-net{margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px}
.rn-title{font-size:16px; margin:0 0 4px}
.rn-sub{margin:0 0 10px; font-size:13px; color:var(--ink-soft)}
.rn-plot{display:flex; justify-content:center; position:relative; overflow-x:auto}
.rn-plot canvas{display:block}
.rn-plot .plot-empty{position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); margin:0; font-size:13px; color:var(--ink-soft); text-align:center}

/* 三维整屋图 */
.r3d-plot{position:relative; display:flex; justify-content:center; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.r3d-plot canvas{display:block; width:100%; height:auto; touch-action:none; cursor:grab}
.r3d-plot canvas:active{cursor:grabbing}
.r3d-plot .plot-empty{position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); margin:0; font-size:13px; color:var(--ink-soft); text-align:center; padding:0 12px}
.add-btn{flex:1; min-height:50px; border-radius:12px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); font-size:16px; font-weight:800}
.app-foot{margin-top:18px; text-align:center; font-size:12px; color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <h1>排砖预览</h1>
    <p>卫生间墙地砖排版 · 方格示意 · 数据存在本机</p>
  </header>

  <div class="legend">
    <span class="lg"><i class="sw-cut">120</i> 裁砖（非整砖）实测尺寸</span>
    <span class="lg"><i class="sw-edge">前</i> 方位（前/后/左/右）</span>
    <span class="lg"><i class="sw-col"></i> 包管立柱（往外凸）</span>
    <span class="lg"><i class="sw-open"></i> 门 / 窗</span>
  </div>

  <!-- 顶部设置区 -->
  <section class="settings" id="settings">
    <div class="settings-box">
      <button class="settings-toggle" id="settingsToggle" aria-expanded="false">
        <span class="settings-summary" id="settingsSummary"></span>
        <span class="chev">▼</span>
      </button>
      <div class="settings-body" id="settingsBody">

        <div class="set-row">
          <span class="set-label">墙砖规格（毫米）</span>
          <div class="chips" id="wallChips"></div>
          <div class="custom-inputs" id="wallCustom">
            <label class="field mini"><span>宽</span><input type="text" inputmode="numeric" id="wallCW" placeholder="如 300"></label>
            <label class="field mini"><span>高</span><input type="text" inputmode="numeric" id="wallCH" placeholder="如 600"></label>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">地砖规格（毫米）</span>
          <div class="chips" id="floorChips"></div>
          <div class="custom-inputs" id="floorCustom">
            <label class="field mini"><span>宽</span><input type="text" inputmode="numeric" id="floorCW" placeholder="如 300"></label>
            <label class="field mini"><span>高</span><input type="text" inputmode="numeric" id="floorCH" placeholder="如 300"></label>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">铺贴方向</span>
          <div class="seg" id="dirSeg">
            <button data-v="horizontal">横铺</button>
            <button data-v="vertical">竖铺</button>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">起铺方式</span>
          <div class="seg" id="startSeg">
            <button data-v="center">居中对称</button>
            <button data-v="edge">靠一边</button>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">砖缝宽度</span>
          <div class="seg" id="groutSeg">
            <button data-v="2">2 mm</button>
            <button data-v="2.5">2.5 mm</button>
          </div>
        </div>

        <div class="set-row">
          <label class="switch-row">
            <span>墙砖压地砖（最底排贴地整砖，裁砖甩到顶）</span>
            <input type="checkbox" id="wallOverFloor" class="switch">
          </label>
        </div>

      </div>
    </div>
  </section>

  <main id="cards"></main>

  <div class="add-row" id="addRow"></div>

  <section class="room-net" id="roomNetWrap">
    <h2 class="rn-title">整屋展开图</h2>
    <p class="rn-sub" id="roomNetSub">地面居中，四面墙按“墙地通缝”设定的边围在四周（像把盒子拆开）</p>
    <div class="rn-plot">
      <canvas id="roomNet"></canvas>
      <p class="plot-empty" id="roomNetEmpty"></p>
    </div>
  </section>

  <section class="room-net" id="room3dWrap">
    <h2 class="rn-title">三维整屋图</h2>
    <p class="rn-sub">按住鼠标拖动旋转视角，滚轮缩放；离镜头近的墙会自动隐藏，方便看进屋里。</p>
    <div class="r3d-plot">
      <canvas id="room3d"></canvas>
      <p class="plot-empty" id="room3dEmpty">填好地面、墙砖规格并出图后，这里出现可旋转的三维房间</p>
    </div>
  </section>

  <footer class="app-foot">改完自动保存 · 给业主看效果：手机截图发微信即可</footer>
</div>

<script>
"use strict";
/*ENGINE-START*/
/* ============================================================
 * 排版引擎（纯函数，可单独测试）
 * ============================================================ */
const Engine = (() => {

  /* 由“门在图的哪条边”推出四条边的 前/后/左/右。
   * 规则：门所在边 = 后；正对边 = 前；
   * 人站在门口面向“前”墙时，左手边 = 左，右手边 = 右。 */
  const deriveEdges = (doorEdge) => ({
    bottom: { back:"bottom", front:"top",    left:"left",   right:"right"  },
    top:    { back:"top",    front:"bottom", left:"right",  right:"left"   },
    left:   { back:"left",   front:"right",  left:"top",    right:"bottom" },
    right:  { back:"right",  front:"left",   left:"bottom", right:"top"    },
  }[doorEdge] || null);

  /* 铺贴方向 → 砖的实际摆放尺寸。横铺 = 长边水平，竖铺 = 长边竖直。 */
  const laidDims = (spec, direction) => {
    const a = Math.min(spec.w, spec.h), b = Math.max(spec.w, spec.h);
    return direction === "horizontal" ? { x:b, y:a } : { x:a, y:b };
  };

  /* 整数倍判断（通缝“相配”条件），带浮点容差 */
  const compatible = (a, b) => {
    if (!(a > 0) || !(b > 0)) return false;
    const isInt = x => x >= 1 && Math.abs(x - Math.round(x)) < 1e-6;
    return isInt(a / b) || isInt(b / a);
  };

  /* 沿一条长度 L 的轴排砖。
   * mode: center 居中对称 / edge 靠一边
   * phaseOverride: 锁定网格起点（通缝对齐用），给了就不再做 1/3 调整
   * 返回 { segments:[{start,width,cut}], phase, cutLeft, cutRight, adjusted, narrow } */
  const layoutAxis = (L, t, g, mode, phaseOverride) => {
    if (!(L > 0) || !(t > 0)) return { segments:[], phase:0, step:0, cutLeft:null, cutRight:null, adjusted:false, narrow:false };
    const p = t + g;
    if (L < t) { // 墙比一块砖还窄：一整块裁砖覆盖
      return { segments:[{ start:0, width:L, cut:true }], phase:0, step:p, cutLeft:L, cutRight:L, adjusted:false, narrow:true };
    }
    const build = (phase) => {
      const segs = [];
      const i0 = Math.floor((0 - phase) / p) - 1;
      for (let i = i0; ; i++) {
        const s0 = phase + i * p;
        if (s0 >= L) break;
        const v0 = Math.max(0, s0), v1 = Math.min(L, s0 + t);
        if (v1 - v0 > 1e-9) {
          const full = s0 >= -1e-9 && s0 + t <= L + 1e-9;
          segs.push({ start:v0, width:v1 - v0, cut:!full });
        }
        if (segs.length > 600) { segs.dense = true; break; } // 极小砖防爆
      }
      return segs;
    };
    const edgeCuts = (segs) => {
      let left = null, right = null;
      if (segs.length) {
        if (segs[0].cut) left = segs[0].width;
        if (segs[segs.length - 1].cut) right = segs[segs.length - 1].width;
      }
      return { left, right };
    };

    let phase, adjusted = false;
    if (phaseOverride != null) {
      phase = ((phaseOverride % p) + p) % p;
    } else {
      const nFull = Math.floor((L + g) / p);
      const F = nFull * p - g;              // 整砖块总宽
      const base = mode === "center" ? (((L - F) / 2) % p + p) % p : 0;
      phase = base;
      const c0 = edgeCuts(build(phase));
      // 裁砖 1/3 规矩：任一边缘裁砖 < 整砖 1/3 → 整体平移半个模块
      if ((c0.left != null && c0.left < t / 3) || (c0.right != null && c0.right < t / 3)) {
        phase = (base + p / 2) % p;
        adjusted = true;
      }
    }
    const segments = build(phase);
    const cuts = edgeCuts(segments);
    return { segments, phase, step:p, cutLeft:cuts.left, cutRight:cuts.right, adjusted, narrow:false };
  };

  /* ============================================================
   * 地漏找坡（方案 2.4 / 4.3）
   *
   * 高度模型就一句话：
   *     h(x, y) = k × 到"最低处"的（横向距离 + 竖向距离）
   *     k = drop / 1000   —— 横、竖两个方向各自每毫米降多少
   *
   * 为什么必须是这个式子，而不是"每个分区朝自己对角方向斜"：
   *   后者在分水线上两个分区算出来的高度不一样，会出现几毫米的台阶（水就积在那儿）。
   *   用上面这个式子，沿竖线/横线两侧算出来一模一样，永远不会有台阶。
   * 代价：分区内最陡方向固定 45°，不是严格指向地漏（方案第 7 节有说明）。
   * ============================================================ */

  const numOr = (v, d) => (typeof v === "number" && isFinite(v)) ? v : d;

  /* 师傅量的"离左墙 / 离后墙" → 图坐标。
   * 门换到别的边时，"后墙""左墙"落在图的哪条边会跟着变，必须查 deriveEdges 换算
   * （方案第 3 节四行对照表）。这里搞反是本项目最容易出的 bug。 */
  const drainToDiagram = (drain, card, doorEdge) => {
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    const L = numOr(drain && drain.fromLeft, 0), B = numOr(drain && drain.fromBack, 0);
    const edges = deriveEdges(doorEdge) || deriveEdges("bottom");
    // 沿某条图边往里量 dist，落点在哪个轴上
    const along = (edge, dist) => {
      if (edge === "top")    return { axis:"y", v: dist };
      if (edge === "bottom") return { axis:"y", v: H - dist };
      if (edge === "left")   return { axis:"x", v: dist };
      return /* right */            { axis:"x", v: W - dist };
    };
    const b = along(edges.back, B);   // 后墙 → 离后墙
    const l = along(edges.left, L);   // 左墙 → 离左墙
    const at = { x:0, y:0 };
    if (b.axis === "y") at.y = b.v; else at.x = b.v;
    if (l.axis === "y") at.y = l.v; else at.x = l.v;
    return at;
  };

  /* 四种造型 → 引擎只认的两种"最低处"：点 或 轴对齐线段。
   * 下游（slopeZones / drainCutLines / 渲染）只看这个结果，
   * 不认识 square / round / linear 这些词。 */
  const drainShape = (drain, card, doorEdge) => {
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    const d = drain || {};
    const at = drainToDiagram(d, card, doorEdge);
    const gap = numOr(d.gap, 3);
    const cw = (v) => Math.max(0, Math.min(W, v));
    const ch = (v) => Math.max(0, Math.min(H, v));
    const shape = {
      kind: d.kind || "square",
      isLine: d.kind === "linear",
      point: null,                 // 点状：最低点（图坐标）
      seg: null,                   // 线状：最低线段（中心线）{ ax, ay, bx, by }
      wide: 0,                     // 线状：地漏宽度 mm
      open: null,                  // 洞口（含留缝）轴对齐矩形 { kind, x, y, w, h }
      drop: numOr(d.drop, 10),
    };
    if (!shape.isLine) {
      const size = numOr(d.size, 100);
      shape.point = { x: cw(at.x), y: ch(at.y) };
      const s = size + 2 * gap;
      shape.open = { kind: d.kind === "round" ? "circle" : "square",
                     x: cw(at.x - s / 2), y: ch(at.y - s / 2), w: s, h: s };
      return shape;
    }
    // 长条：rot 0 = 沿地面长边（横），90 = 竖；贴边时方向由那条边决定
    const len = numOr(d.len, 300), wide = numOr(d.wide, 64);
    shape.wide = wide;
    let horizontal = Number(d.rot) !== 90;
    if (d.against) {
      const edges = deriveEdges(doorEdge) || deriveEdges("bottom");
      const e = edges[d.against];
      if (e) horizontal = (e === "top" || e === "bottom");
    }
    const half = len / 2;
    if (horizontal) {
      const y = ch(at.y);
      const ax = cw(at.x - half), bx = cw(at.x + half);
      shape.seg = { ax, ay: y, bx, by: y };
      shape.open = { kind:"rect", x: cw(ax - gap), y: ch(y - wide / 2 - gap),
                     w: (bx - ax) + 2 * gap, h: wide + 2 * gap };
    } else {
      const x = cw(at.x);
      const ay = ch(at.y - half), by = ch(at.y + half);
      shape.seg = { ax: x, ay, bx: x, by };
      shape.open = { kind:"rect", x: cw(x - wide / 2 - gap), y: ch(ay - gap),
                     w: wide + 2 * gap, h: (by - ay) + 2 * gap };
    }
    return shape;
  };

  /* 到"最低处"的横竖距离之和（4.3 的核心公式） */
  const lowDist = (shape, x, y) => {
    if (shape.isLine && shape.seg) {
      const s = shape.seg;
      if (Math.abs(s.ay - s.by) < 1e-9) {            // 水平最低线
        const dx = (x < s.ax) ? (s.ax - x) : (x > s.bx ? (x - s.bx) : 0);
        return dx + Math.abs(y - s.ay);
      }
      const dy = (y < s.ay) ? (s.ay - y) : (y > s.by ? (y - s.by) : 0);
      return Math.abs(x - s.ax) + dy;
    }
    const p = shape.point || { x:0, y:0 };
    return Math.abs(x - p.x) + Math.abs(y - p.y);
  };

  /* 分区：用"过最低处每个端点、且平行于墙的线"把地面切成轴对齐矩形。
   *   点状 → 一横一竖 2 条线 → 4 块
   *   长条 → 两端各一条垂线 + 自身那条线 → 至多 6 块（贴死墙时退化成 3 块）
   * 零宽/零高的退化块直接丢掉。每个分区存"矩形 + 四角高度"，
   * 因为 h 在分区内是线性函数，四角必然共面，双线性插值就是精确值。 */
  const slopeZones = (card, shape, drop) => {
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    if (!(W > 0) || !(H > 0) || !shape) return [];
    const k = (typeof drop === "number" && isFinite(drop)
      ? drop : numOr(shape.drop, 10)) / 1000;
    let xs = [], ys = [];
    if (shape.isLine && shape.seg) {
      const s = shape.seg;
      if (Math.abs(s.ay - s.by) < 1e-9) { xs = [s.ax, s.bx]; ys = [s.ay]; }
      else                              { xs = [s.ax]; ys = [s.ay, s.by]; }
    } else {
      const p = shape.point || { x:0, y:0 };
      xs = [p.x]; ys = [p.y];
    }
    // 把 [0, hi] 按 cut 切成若干段，丢掉零长段
    const strip = (cuts, hi) => {
      const out = [];
      let last = 0;
      cuts.map((v) => Math.max(0, Math.min(hi, v)))
          .filter((v) => isFinite(v))
          .sort((a, b) => a - b)
          .forEach((c) => { if (c > last + 1e-9) out.push([last, c]); last = c; });
      if (hi > last + 1e-9) out.push([last, hi]);
      return out;
    };
    const xb = strip(xs, W), yb = strip(ys, H);
    const zones = [];
    for (const [x0, x1] of xb) for (const [y0, y1] of yb) {
      zones.push({
        x: x0, y: y0, w: x1 - x0, h: y1 - y0,  // 矩形分区
        hc: [                                   // 四角高度：左上 / 右上 / 左下 / 右下
          k * lowDist(shape, x0, y0),
          k * lowDist(shape, x1, y0),
          k * lowDist(shape, x0, y1),
          k * lowDist(shape, x1, y1),
        ],
      });
    }
    return zones;
  };

  /* 查高度（mm）。分区内 h 是线性函数 → 四角共面 → 双线性插值就是精确值。
   * 点正好落在分区边界上时，任取一侧都一样（模型保证连续）。 */
  const slopeHeightAt = (zones, x, y) => {
    if (!zones || !zones.length) return 0;
    let best = null, bestD = Infinity;
    for (const z of zones) {
      if (x >= z.x - 1e-9 && x <= z.x + z.w + 1e-9 &&
          y >= z.y - 1e-9 && y <= z.y + z.h + 1e-9) { best = z; break; }
      const dx = Math.max(z.x - x, 0, x - (z.x + z.w));   // 落在分区外时取最近的一块
      const dy = Math.max(z.y - y, 0, y - (z.y + z.h));
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; best = z; }
    }
    if (!best) return 0;
    const u = best.w > 1e-9 ? Math.min(1, Math.max(0, (x - best.x) / best.w)) : 0;
    const v = best.h > 1e-9 ? Math.min(1, Math.max(0, (y - best.y) / best.h)) : 0;
    const c = best.hc;
    return c[0] * (1 - u) * (1 - v) + c[1] * u * (1 - v)
         + c[2] * (1 - u) * v       + c[3] * u * v;
  };

  /* ---- 整砖"骑线"：分水线穿过整砖时，不许锯开 ----
   *
   * 现实里从来没有人沿着分水线锯砖——地面中间的整砖一律整块铺过去，
   * 让砖"骑"在分水线上，砖底下用砂浆垫实。
   *
   * 骑线会让砖底出现一点悬空：砖跨 [x0, x1]、折线在 a 处时，
   * 表面是个 V（两端高 k·dL、k·dR），最佳平面拟合的最大偏差是
   *     gap = k × dL × dR / (dL + dR)
   * 最坏情况（折线正过砖心）= k × 砖宽 / 4。
   *   300 砖 @1% → 0.75mm    600 砖 @1% → 1.5mm   ← 砂浆直接吸收，不用管
   *   800 砖 @2% → 4.0mm                          ← 这个才真要处理
   */
  const rideGap = (k, t, dL) => {
    const dR = t - dL;
    if (!(dL > 0) || !(dR > 0)) return 0;    // 折线在砖外 → 整块在一个平面上，不悬空
    return k * dL * dR / t;
  };

  /* 一条轴上，分水线穿过哪些砖、最大悬空量多少。
   * axis 是 layoutAxis 的结果，fold 是分水线在这条轴上的位置。
   * 返回 { max, worst:{start,width,dL,gap}, count } —— count 是骑线的砖数。 */
  const rideReport = (k, axis, fold) => {
    const out = { max: 0, worst: null, count: 0 };
    if (!axis || !axis.segments) return out;
    for (const s of axis.segments) {
      const dL = fold - s.start;
      if (dL <= 1e-9 || dL >= s.width - 1e-9) continue;   // 折线不在这块砖里
      const g = rideGap(k, s.width, dL);
      out.count++;
      if (g > out.max) { out.max = g; out.worst = { start: s.start, width: s.width, dL, gap: g }; }
    }
    return out;
  };

  /* ---- 分水线：只用来弹墨线、算骑线，不再产生任何切割（方案 2.5）----
   * 点状 → 过地漏的一横一竖；长条 → 过长条两端的两条垂线。全部轴对齐。
   * （名字里曾带 cut，是"沿线锯开"初稿的遗留；现场从来没有沿分水线锯砖的。） */
  const drainRidgeLines = (card, shape) => {
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    if (!shape) return [];
    if (shape.isLine && shape.seg) {
      const s = shape.seg;
      if (Math.abs(s.ay - s.by) < 1e-9)          // 横放 → 两端各一条竖线
        return [{ x1:s.ax, y1:0, x2:s.ax, y2:H }, { x1:s.bx, y1:0, x2:s.bx, y2:H }];
      return [{ x1:0, y1:s.ay, x2:W, y2:s.ay }, { x1:0, y1:s.by, x2:W, y2:s.by }];
    }
    const p = shape.point || { x:0, y:0 };
    return [{ x1:p.x, y1:0, x2:p.x, y2:H }, { x1:0, y1:p.y, x2:W, y2:p.y }];
  };

  /* 洞口（含留缝）：要挖掉的就是这一块矩形。切砖和面积守恒都按它算。 */
  const drainOpening = (shape) => {
    const o = shape && shape.open;
    return o ? { kind:o.kind, x:o.x, y:o.y, w:o.w, h:o.h }
             : { kind:"none", x:0, y:0, w:0, h:0 };
  };

  const mod = (v, m) => ((v % m) + m) % m;
  const rectPts = (r) => [
    { x:r.x, y:r.y }, { x:r.x + r.w, y:r.y },
    { x:r.x + r.w, y:r.y + r.h }, { x:r.x, y:r.y + r.h },
  ];
  const bboxOf = (pts) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
      x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
    }
    return { x:x0, y:y0, w:x1 - x0, h:y1 - y0 };
  };
  const rectHit = (a, b) =>
    a.x < b.x + b.w - 1e-9 && b.x < a.x + a.w - 1e-9 &&
    a.y < b.y + b.h - 1e-9 && b.y < a.y + a.h - 1e-9;
  const polyAreaOf = (pts) => {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      s += a.x * b.y - b.x * a.y;
    }
    return Math.abs(s) / 2;
  };

  /* 半平面裁剪：拿一条轴对齐直线切多边形，只留一侧（Sutherland–Hodgman）。
   * 交点是一元一次方程，无迭代、无库。 */
  const clipHalf = (pts, vertical, c, side) => {
    const f = (p) => ((vertical ? p.x : p.y) - c) * side;
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const da = f(a), db = f(b);
      if (da >= -1e-9) out.push(a);
      if ((da > 1e-9 && db < -1e-9) || (da < -1e-9 && db > 1e-9)) {
        const t = da / (da - db);
        out.push(vertical ? { x:c, y:a.y + (b.y - a.y) * t }
                          : { x:a.x + (b.x - a.x) * t, y:c });
      }
    }
    return out;
  };

  /* 一块矩形砖被若干条直线切成几个凸多边形（每条线的两侧都留，依次切）。
   * 2.5 之后不再喂分水线给它——分水线穿过整砖一律不锯（走 rideGap/rideReport），
   * 它只服务"长条本体的直切"和靠墙收边这类真要下刀的地方。 */
  const cutRectByLines = (rect, lines) => {
    const r = rect.pts ? bboxOf(rect.pts) : rect;
    let parts = [rectPts(r)];
    for (const ln of (lines || [])) {
      const vertical = Math.abs(ln.x1 - ln.x2) < 1e-9;
      const c = vertical ? ln.x1 : ln.y1;
      const next = [];
      for (const poly of parts) {
        for (const sd of [1, -1]) {
          const cut = clipHalf(poly, vertical, c, sd);
          if (cut.length >= 3 && polyAreaOf(cut) > 1e-6) next.push(cut);
        }
      }
      parts = next;
    }
    return parts.map((pts) => ({ pts }));
  };

  /* 一块矩形砖被洞口挖掉后剩什么：拆成 ≤ 4 个轴对齐矩形，**面积精确守恒**。
   * 师傅手上的"回字对角切 / 套割"是切法与标注（paintDrainPlan 画），
   * 几何上仍是这几块矩形——这样切块永远能过"是不是直刀"的断言。 */
  const cutRectByHole = (rect, hole) => {
    const r = rect.pts ? bboxOf(rect.pts) : rect;
    if (!hole || !(hole.w > 0) || !(hole.h > 0) || !rectHit(r, hole)) return [{ pts: rectPts(r) }];
    const ix0 = Math.max(r.x, hole.x), iy0 = Math.max(r.y, hole.y);
    const ix1 = Math.min(r.x + r.w, hole.x + hole.w), iy1 = Math.min(r.y + r.h, hole.y + hole.h);
    const out = [];
    const add = (x, y, w, h) => { if (w > 1e-9 && h > 1e-9) out.push({ pts: rectPts({ x, y, w, h }) }); };
    add(r.x, r.y, r.w, iy0 - r.y);                 // 上
    add(r.x, iy1, r.w, r.y + r.h - iy1);           // 下
    add(r.x, iy0, ix0 - r.x, iy1 - iy0);           // 左中
    add(ix1, iy0, r.x + r.w - ix1, iy1 - iy0);     // 右中
    return out;
  };

  /* 选一个让"目标线正好压在砖缝上"的起铺相位（方案 4.4）。
   *   闭式一步：ideal = X0 mod p —— 砖从 ideal 起铺，X0 就落在某块砖的左边缘上
   *   若 ideal 破坏 1/3 老规矩 → 在合法相位里取离 ideal 最近的（退化成一次小扫描） */
  const pickCrossPhase = (L, t, g, mode, X0, minPiece) => {
    const p = t + g, minP = numOr(minPiece, 0);
    const legal = (ax) => [ax.cutLeft, ax.cutRight].every(
      (c) => c == null || (c >= t / 3 - 1e-9 && c >= minP - 1e-9));
    const ideal = mod(X0, p);
    if (X0 == null || !isFinite(ideal)) return { phase: layoutAxis(L, t, g, mode).phase, zeroCut: false, fallback: false };
    if (legal(layoutAxis(L, t, g, mode, ideal))) return { phase: ideal, zeroCut: true, fallback: false };
    let best = null, bestD = Infinity;
    for (let ph = 0; ph < p; ph += 1) {
      if (!legal(layoutAxis(L, t, g, mode, ph))) continue;
      const raw = Math.abs(ph - ideal);
      const d = Math.min(raw, p - raw);            // 相位是个环，取环形距离
      if (d < bestD - 1e-9) { bestD = d; best = ph; }
    }
    if (best == null) return { phase: layoutAxis(L, t, g, mode).phase, zeroCut: false, fallback: true };
    return { phase: best, zeroCut: false, fallback: true };
  };

  /* 下料清单 + 三笔账（方案 7.15）：
   *   drainCuts  地漏周围要切的砖（套割 / 回字对角切 / 长条整排直切）—— 永远 ≥ 1
   *   edgeCuts   靠墙收边（1/3 老规矩，与找坡无关，单独报，不计入 cutCount）
   *   ride       分水线穿过的砖 → **骑线，不切**，只报底下垫多少灰
   *   ridgeCuts  恒为 0：分水线永不切砖（留着给断言看，见 8b）          */
  const drainCutPlan = (drain, card, layout, shape) => {
    const d = drain || {};
    const sh = shape || drainShape(d, card);
    const hole = drainOpening(sh);
    const k = numOr(d.drop, 10) / 1000;
    const minPiece = numOr(d.minPiece, 50);
    const gap = numOr(d.gap, 3);
    const ax = layout.x, ay = layout.y;
    const gg = numOr(layout.g, 0);
    const tX = numOr(layout.tx, ax.step - gg), tY = numOr(layout.ty, ay.step - gg);
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    const lines = drainRidgeLines(card, sh);
    const vFolds = lines.filter((l) => Math.abs(l.x1 - l.x2) < 1e-9).map((l) => l.x1);
    const hFolds = lines.filter((l) => Math.abs(l.y1 - l.y2) < 1e-9).map((l) => l.y1);
    // 折线落在这块砖里才算骑线（落在砖缝上 → 0，压缝就是这么来的）
    const segRide = (seg, fold) => {
      const dL = fold - seg.start;
      if (!(dL > 1e-9) || !(dL < seg.width - 1e-9)) return 0;
      return rideGap(k, seg.width, dL);
    };

    const grid = [], drainTiles = [];
    let edgeCuts = 0, scrap = 0, minStrip = Infinity, rideCount = 0, rideMax = 0;
    for (const sy of ay.segments) for (const sx of ax.segments) {
      const r = { x:sx.start, y:sy.start, w:sx.width, h:sy.width };
      const holed = rectHit(r, hole);
      const cut = !!(sx.cut || sy.cut);
      const polys = holed ? cutRectByHole(r, hole) : [{ pts: rectPts(r) }];
      const ride = holed ? 0 : Math.max(
        vFolds.reduce((m, v) => Math.max(m, segRide(sx, v)), 0),
        hFolds.reduce((m, v) => Math.max(m, segRide(sy, v)), 0));
      const tile = {
        rect: rectPts(r), x:r.x, y:r.y, w:r.w, h:r.h,
        polys, ride,
        cut: cut || holed,
        hole: holed ? hole : null,
        reason: holed ? "drain" : (cut ? "edge" : null),
      };
      if (ride > 0) { rideCount++; rideMax = Math.max(rideMax, ride); }
      if (tile.cut) {
        for (const p of polys) {
          const bb = bboxOf(p.pts), m = Math.min(bb.w, bb.h);
          if (m >= minPiece) { if (m < minStrip) minStrip = m; } else scrap++;
        }
      }
      if (holed) drainTiles.push(tile); else if (cut) edgeCuts++;
      grid.push(tile);
    }

    /* 点状：落点判定 → 切法（2.4.3 第二步表） */
    let cutStyle = "strip", clearance = null;
    if (!sh.isLine) {
      const p = ax.step, phX = ax.phase, phY = ay.phase;
      const c = sh.point || { x:0, y:0 };
      const halfW = hole.w / 2, halfH = hole.h / 2;
      // 洞口四边到最近砖缝的距离；若有砖缝从洞口中间穿过 → 0（骑缝）
      const clearanceOf = (lo, hi, ph, t, L) => {
        let best = Infinity;
        for (let e = mod(ph, p) - p; e <= L + p; e += p) {
          for (const seam of [e, e + t]) {
            if (seam <= lo + 1e-9) best = Math.min(best, lo - seam);
            else if (seam >= hi - 1e-9) best = Math.min(best, seam - hi);
            else return 0;
          }
        }
        return best;
      };
      const clearX = clearanceOf(c.x - halfW, c.x + halfW, phX, tX, W);
      const clearY = clearanceOf(c.y - halfH, c.y + halfH, phY, tY, H);
      clearance = Math.min(clearX, clearY);
      const a = mod(c.x - phX, p), b = mod(c.y - phY, p);
      const distX = a <= tX ? Math.min(a, tX - a) : 0;      // 到最近砖缝的距离
      const distY = b <= tY ? Math.min(b, tY - b) : 0;
      const tol = Math.min(25, tX / 6);
      cutStyle = (distX <= tol && distY <= tol) ? "corner"                        // 四砖交角
               : (clearX < gap + 20 || clearY < gap + 20) ? "seam"                // 骑缝
               : "hole";                                                          // 砖心套割
      if (d.cutStyle === "hole" || d.cutStyle === "corner") cutStyle = d.cutStyle; // 师傅指定
      if (cutStyle === "hole") {
        const sx = ax.segments.find((s) => c.x >= s.start - 1e-9 && c.x <= s.start + s.width + 1e-9);
        const sy = ay.segments.find((s) => c.y >= s.start - 1e-9 && c.y <= s.start + s.width + 1e-9);
        const host = sx && sy && grid.find(
          (t) => Math.abs(t.x - sx.start) < 1e-9 && Math.abs(t.y - sy.start) < 1e-9);
        if (host) {
          host.abcd = {                                     // 孔中心到砖四边：师傅开孔就靠这四个数
            a: c.x - sx.start, b: sx.start + sx.width - c.x,
            c: c.y - sy.start, d: sy.start + sy.width - c.y,
          };
        }
      }
    } else {
      // 长条：洞口离最近的墙多远（槽体要有地方装）
      clearance = Math.min(hole.x, hole.y, W - (hole.x + hole.w), H - (hole.y + hole.h));
    }

    return {
      cutStyle, clearance,
      drainCuts: drainTiles.length,
      edgeCuts,
      ridgeCuts: 0,                        // 分水线永不切砖（2.5）
      cutCount: drainTiles.length,         // 地漏/找坡这边的账；靠墙收边另算
      minStrip: isFinite(minStrip) ? minStrip : null,
      scrapCount: scrap,
      ride: { count: rideCount, max: rideMax },
      tiles: drainTiles,                   // 下料清单（只有地漏相关的）
      grid,                                // 整片砖网（渲染用）
      hole,
    };
  };

  /* 选型与校核建议（纯提示，不改排版）。约定：{ items:[{ kind, text }] } */
  const DRAIN_CAP = [[300, 35], [500, 45], [600, 55]];        // 长条长度 → 排水量 L/min
  const SHOWER_NEED = { hand: 12, rain: 25, both: 40 };
  const drainAdvice = (drain, card, dims, info) => {
    const d = drain || {}, it = info || {};
    const zones = it.zones || [], plan = it.plan || null;
    const W = numOr(card && card.w, 0), H = numOr(card && card.h, 0);
    const items = [];

    // ① 最远角抬高量（>30mm 报警：门槛石、门扇、过门石全得跟着抬）
    if (zones.length && W > 0 && H > 0) {
      let rise = 0;
      for (const c of [[0, 0], [W, 0], [0, H], [W, H]]) rise = Math.max(rise, slopeHeightAt(zones, c[0], c[1]));
      const drop = numOr(d.drop, 10);
      items.push(rise > 30
        ? { kind:"error", text:`最远墙角要抬高 ${Math.round(rise)}mm，超过 30mm，门槛石、门扇、过门石都得跟着抬` }
        : { kind:"info", text:`最远墙角抬高 ${rise.toFixed(1)}mm（沿墙每米降 ${drop}mm，朝地漏 45° 方向实际 ${(drop * 1.414).toFixed(1)}mm/m）` });
    }
    // ② 长条贴边：槽体要有地方放
    if (d.kind === "linear" && d.against) {
      const dist = { back: numOr(d.fromBack, 0), front: H - numOr(d.fromBack, 0),
                     left: numOr(d.fromLeft, 0), right: W - numOr(d.fromLeft, 0) }[d.against];
      const need = numOr(d.wide, 64) / 2 + 20;
      if (dist != null && dist < need)
        items.push({ kind:"error", text:`长条离墙只有 ${Math.round(dist)}mm，槽体至少要 ${Math.round(need)}mm，装不下` });
    }
    // ③ 长条排水量 vs 花洒流量（产品分档卖，取最接近的一档，不插值）
    if (d.kind === "linear") {
      const len = numOr(d.len, 300);
      let cap = DRAIN_CAP[0][1], bestD = Infinity;
      for (const [L, c] of DRAIN_CAP) {
        const dd = Math.abs(len - L);
        if (dd < bestD) { bestD = dd; cap = c; }
      }
      const need = SHOWER_NEED[d.shower] != null ? SHOWER_NEED[d.shower] : 12;
      if (cap < need)
        items.push({ kind:"warn", text:`${Math.round(len)}mm 长条只够 ${cap} L/min，这个花洒要 ${need} L/min，建议换长一号` });
    }
    // ④ 落点 → 切法（人话）
    if (plan) {
      if (plan.cutStyle === "corner")
        items.push({ kind:"info", text:`地漏落在四砖交角：周围 ${plan.drainCuts} 块砖各切一个 45° 角（回字对角切），最省料` });
      else if (plan.cutStyle === "hole")
        items.push({ kind:"ok", text:`地漏落在砖心：只切 ${plan.drainCuts} 块，中间开孔（孔中心到砖四边 ${abcdText(plan)}）` });
      else if (plan.cutStyle === "seam")
        items.push({ kind:"warn", text:`洞口骑在砖缝上（离最近砖缝 ${Math.round(plan.clearance)}mm，要留出 ${Math.round(numOr(d.gap, 3) + 20)}mm），毛边会外露，建议挪到砖心或四砖交角` });
      else if (plan.cutStyle === "strip")
        items.push({ kind:"info", text:`长条压住 ${plan.drainCuts} 块砖，沿两条长边直切，切下的条最窄 ${Math.round(plan.minStrip || 0)}mm` });
      // ⑤ 骑线：地面中间不动锯子
      const lineName = d.kind === "linear" ? "分区线" : "十字分水线";
      if (plan.ride.count > 0)
        items.push({ kind:"info", text: plan.ride.max >= 0.1
          ? `有 ${plan.ride.count} 块砖骑在${lineName}上，不用切，底下最多垫 ${plan.ride.max.toFixed(1)}mm 灰`
          : `有 ${plan.ride.count} 块砖骑在${lineName}上，但高差不到 0.1mm，照常铺、不用管` });
      else
        items.push({ kind:"ok", text:`${lineName}已压在砖缝上，地面中间一块砖都不用管` });
      if (plan.scrapCount > 0)
        items.push({ kind:"info", text:`另有 ${plan.scrapCount} 块碎料窄于 ${Math.round(numOr(d.minPiece, 50))}mm（多是洞口留缝处的边角），现场直接勾缝填掉` });
    }
    return { items };
  };
  const abcdText = (plan) => {
    const t = plan.tiles && plan.tiles[0] && plan.tiles[0].abcd;
    return t ? `${Math.round(t.a)} / ${Math.round(t.b)} / ${Math.round(t.c)} / ${Math.round(t.d)}` : "—";
  };

  /* 计算整个场景：先地面（定型），再各墙（竖直自由、水平可被通缝锁定） */
  const computeScene = (state) => {
    const s = state.settings;
    const g = s.grout;
    const floorCard = state.cards.find(c => c.type === "floor") || null;
    const wDims = s.wallTile  ? laidDims(s.wallTile,  s.direction) : null;
    const fDims = s.floorTile ? laidDims(s.floorTile, s.direction) : null;
    const scene = { floor:null, walls:{} };

    // 四面墙 side 分配（与整屋展开图/三维一致）：不通缝时也据此决定对齐到地面哪条轴
    const sideMap = new Map();
    {
      const used = new Set(); const order = ["front", "back", "left", "right"];
      for (const card of state.cards) {
        if (card.type !== "wall" || !(card.w > 0) || !(card.h > 0)) continue;
        let s = null;
        if (card.alignEdge && card.alignEdge !== "none" && !used.has(card.alignEdge)) { used.add(card.alignEdge); s = card.alignEdge; }
        else { for (const q of order) if (!used.has(q)) { used.add(q); s = q; break; } }
        if (s) sideMap.set(card.id, s);
      }
    }
    scene.sideOf = sideMap;      // 渲染侧要知道"每面墙站在地面哪条边"（画墙根坡线用）

    /* ① 先算地面 */
    let floorX = null, floorY = null;
    if (floorCard && floorCard.w > 0 && floorCard.h > 0 && fDims) {
      floorX = layoutAxis(floorCard.w, fDims.x, g, s.startMode);
      floorY = layoutAxis(floorCard.h, fDims.y, g, s.startMode);
      scene.floor = { card:floorCard, x:floorX, y:floorY, edges:deriveEdges(state.doorEdge), statuses:[] };
      // 地砖尽量从门口发整砖：把垂直门的那条轴，整砖锁在门口边（远端才裁砖）
      const de = state.doorEdge;
      const doorLabel = { bottom:"下边", top:"上边", left:"左边", right:"右边" }[de];
      if (doorLabel) {
        const isY = (de === "bottom" || de === "top");
        const tBig = isY ? fDims.y : fDims.x;
        const Lbig = isY ? floorCard.h : floorCard.w;
        const p = tBig + g;
        // 门口在起点边 → phase 0（门口整砖）；门口在终点边 → phase=(L-t) mod p（远端裁砖）
        const phase = (de === "top" || de === "left")
          ? 0
          : (((Lbig - tBig) % p) + p) % p;
        if (isY) floorY = layoutAxis(Lbig, tBig, g, s.startMode, phase);
        else      floorX = layoutAxis(Lbig, tBig, g, s.startMode, phase);
        const farCut = (de === "bottom" || de === "right")
          ? (isY ? floorY.cutLeft : floorX.cutLeft)
          : (isY ? floorY.cutRight : floorX.cutRight);
        scene.floor.statuses.push({ kind:"info", text:`地砖从门口（${doorLabel}）发整砖` });
        if (farCut != null && farCut < tBig / 3) {
          scene.floor.statuses.push({ kind:"warn", text:"门口已发整砖，远端裁砖 < 1/3，请现场定夺" });
        }
        scene.floor.x = floorX;
        scene.floor.y = floorY;
      }
      // 规则1：地面两条轴都查 <1/3（受门口锁定的那条轴已由上面专门提示，这里只查另一条）
      const floorCutWarn = (ax, t, name) => {
        const m = Math.min(ax.cutLeft != null ? ax.cutLeft : Infinity, ax.cutRight != null ? ax.cutRight : Infinity);
        if (m < t / 3) scene.floor.statuses.push({ kind:"warn", text:`地面${name}方向边缘裁砖 < 1/3（约 ${Math.round(m)}mm），请现场定夺` });
      };
      if (doorLabel) {
        const isY = (de === "bottom" || de === "top");
        if (isY) floorCutWarn(floorX, fDims.x, "长"); else floorCutWarn(floorY, fDims.y, "宽");
      } else {
        floorCutWarn(floorX, fDims.x, "长"); floorCutWarn(floorY, fDims.y, "宽");
      }

      /* 地漏找坡：算坡面 → 调相位（让分水线压在砖缝上）→ 逐砖算骑线与开孔（方案 4.6） */
      const dr = floorCard.drain && floorCard.drain.on ? floorCard.drain : null;
      if (dr) {
        const shape = drainShape(dr, floorCard, state.doorEdge);
        const zones = slopeZones(floorCard, shape, dr.drop);
        const tX = fDims.x, tY = fDims.y;
        const minP = numOr(dr.minPiece, 50);
        const locked = doorLabel ? ((de === "bottom" || de === "top") ? "y" : "x") : null;
        // 要压到砖缝上的目标线：点状 = 过地漏的一横一竖；
        // 长条 = 两端垂线（沿长条那条轴）+ 靠上一侧的长边（另一条轴）
        let targetX = null, targetY = null;
        if (shape.isLine && shape.seg) {
          const s = shape.seg, halfW = shape.wide / 2 + numOr(dr.gap, 3);
          if (Math.abs(s.ay - s.by) < 1e-9) { targetX = Math.min(s.ax, s.bx); targetY = Math.min(s.ay, s.by) - halfW; }
          else                              { targetY = Math.min(s.ay, s.by); targetX = Math.min(s.ax, s.bx) - halfW; }
        } else if (shape.point) {
          targetX = shape.point.x; targetY = shape.point.y;
        }
        const wantFit = (x) => (shape.isLine ? dr.fitEdges !== false : dr.fitRidges !== false) && x != null;
        let phX = floorX.phase, phY = floorY.phase;
        // 被门口锁住的那条轴不许动相位（方案第 6 节：门口整砖赢）
        if (wantFit(targetX) && locked !== "x") phX = pickCrossPhase(floorCard.w, tX, g, s.startMode, targetX, minP).phase;
        if (wantFit(targetY) && locked !== "y") phY = pickCrossPhase(floorCard.h, tY, g, s.startMode, targetY, minP).phase;
        if (Math.abs(phX - floorX.phase) > 1e-9) floorX = layoutAxis(floorCard.w, tX, g, s.startMode, phX);
        if (Math.abs(phY - floorY.phase) > 1e-9) floorY = layoutAxis(floorCard.h, tY, g, s.startMode, phY);
        scene.floor.x = floorX; scene.floor.y = floorY;

        const plan = drainCutPlan(dr, floorCard, { x:floorX, y:floorY, tx:tX, ty:tY, g }, shape);
        // 墙根是"V 形"还是"等高"：决定底排砖要不要处理（默认做法 B：按最高点起 + 踢脚线盖缝）
        if (shape.isLine && shape.seg) {
          // 只说"长条正对着的那一段"等高：走出长条两端的角区照样会变高，别说满
          scene.floor.statuses.push({ kind:"info",
            text:"长条正对着的那段墙根等高（底排砖不用处理）；走出长条两端的角区会变高，那几列按墙角最高点起砖，底下那道缝用踢脚线盖住" });
        } else {
          scene.floor.statuses.push({ kind:"info",
            text:"四面墙根都是 V 形（两端高、中间最低，中间那个点不是 0）：底排砖按墙角最高点起，底下那道缝用踢脚线盖住" });
        }
        const advice = drainAdvice(dr, floorCard, fDims, { shape, zones, plan });
        scene.floor.slope = {
          drain: dr, shape, zones, plan, advice,
          lines: drainRidgeLines(floorCard, shape),
          hole: plan.hole,
          tiles: plan.grid,
          phase: { x: phX, y: phY },
          ride: plan.ride,
        };
      }
    }

    /* ② 各面墙 */
    for (const wall of state.cards) {
      if (wall.type !== "wall") continue;
      const entry = { card:wall, x:null, y:null, statuses:[], align:null };
      const hasSize = wall.w > 0 && wall.h > 0;
      if (hasSize && wDims) {
        // —— 规则5 墙砖压地砖：墙面竖向（.y）底排整砖、裁到顶 ——
        const wof = s.wallOverFloor !== false;
        let yPhase = null;
        // —— 规则6 门/窗洞口对齐整砖边界（尽力版）——
        // 门：从地面起，规则5 底排整砖天然覆盖门区；窗：竖向相位对齐到窗顶边，使窗上下砖落在整砖边界。
        const win = wall.win;
        const winOk = !!(win && win.on && win.left > 0 && win.width > 0 && win.sill > 0 && win.height > 0 && (win.left + win.width) <= wall.w);
        if (wof && winOk) {
          const p = wDims.y + g;
          const winTop = wall.h - (win.sill || 0) - (win.height || 0); // 窗顶边（从顶算 mm）
          const cand = ((winTop % p) + p) % p;
          const bottomCut = ((wall.h - cand) % p + p) % p; // 0 表示底排整砖，否则为墙底裁砖宽
          if (bottomCut === 0 || bottomCut >= wDims.y / 3) yPhase = cand; // 对齐窗顶且墙底不出现极窄条才采用
        }
        if (yPhase == null && wof) {
          const p = wDims.y + g;
          yPhase = ((wall.h - wDims.y) % p + p) % p; // 底排整砖；裁砖甩到顶部（被吊顶/吊柜遮住）
        }
        entry.y = yPhase != null
          ? layoutAxis(wall.h, wDims.y, g, s.startMode, yPhase)
          : layoutAxis(wall.h, wDims.y, g, s.startMode);

        // 规则4：统计墙高方向裁砖排数（底排整砖时仅顶部1排，不会误报）
        const cutY = entry.y.segments.filter(seg => seg.cut).length;

        let locked = false;
        if (wall.alignEdge && wall.alignEdge !== "none" && scene.floor) {
          const diagramEdge = scene.floor.edges[wall.alignEdge];
          const horizontal = (diagramEdge === "top" || diagramEdge === "bottom");
          const floorAxis = horizontal ? floorX : floorY;
          const floorDim  = horizontal ? fDims.x : fDims.y;
          const edgeLen   = horizontal ? floorCard.w : floorCard.h;
          if (compatible(wDims.x, floorDim)) {
            locked = true;
            // 左墙转 -90°、后墙(有门那面)在展开图里左右镜像，墙的 x 方向都相对地面对应边反向，
            // 直接照搬地面相位会把整面墙的缝翻到另一端（错位≈一个相位）。
            // 故左墙/后墙镜像：墙相位 = (墙长 − 地面相位) mod 墙模块；前/右方向一致，直接照搬。
            const phaseOverride = (wall.alignEdge === "left" || wall.alignEdge === "back")
              ? (wall.w - floorAxis.phase)
              : floorAxis.phase;
            entry.x = layoutAxis(wall.w, wDims.x, g, s.startMode, phaseOverride);
            entry.align = { ok:true };
            entry.statuses.push({ kind:"ok", text:"通缝已对齐" });
            if (Math.abs(wall.w - edgeLen) > 1) {
              entry.statuses.push({ kind:"warn", text:`墙宽 ${wall.w} mm 和地面“${nameOfEdge(wall.alignEdge)}”长度 ${edgeLen} mm 不一致，请核对` });
            }
            const bad = [entry.x.cutLeft, entry.x.cutRight].some(v => v != null && v < wDims.x / 3);
            if (bad) entry.statuses.push({ kind:"error", text:"边缘裁砖小于 1/3，已优先保通缝，请现场定夺" });
          } else {
            entry.statuses.push({ kind:"warn", text:`这两个规格对不了缝（墙砖水平边 ${wDims.x}，地砖边 ${floorDim}）` });
          }
        } else if (wall.alignEdge && wall.alignEdge !== "none") {
          entry.statuses.push({ kind:"info", text:"地面尺寸和地砖规格填好后，才能自动对通缝" });
        }
        if (!locked) {
          // 规则7：不通缝时也优先与地砖“错缝”——对齐到地面砖缝的“另一条”（半砖偏移），
          // 让墙砖缝与地面砖缝错开，不直上直下；仅当错缝导致边缘裁砖 < 1/3 时才回退到自由居中。
          let chosen = null, usedOffset = false;
          if (scene.floor) {
            const side = sideMap.get(wall.id);
            const lr = (side === "left" || side === "right");           // 左/右墙水平方向沿地面“深”边
            const map = lr ? { axis: floorY, dim: fDims.y } : { axis: floorX, dim: fDims.x };
            if (map.axis && compatible(wDims.x, map.dim)) {
              const p = wDims.x + g;
              const mirror = (side === "left" || side === "back");       // 左/后墙在展开图里左右镜像
              const base = mirror ? (wall.w - map.axis.phase) : map.axis.phase;
              const off = (((base + p / 2) % p) + p) % p;                // 半砖偏移 = 地面“另一条缝”
              const cand = layoutAxis(wall.w, wDims.x, g, s.startMode, off);
              const minCut = Math.min(cand.cutLeft != null ? cand.cutLeft : Infinity, cand.cutRight != null ? cand.cutRight : Infinity);
              if (minCut >= wDims.x / 3) { chosen = cand; usedOffset = true; }
            }
          }
          if (!chosen) chosen = layoutAxis(wall.w, wDims.x, g, s.startMode); // 兜底：保持原自由居中
          entry.x = chosen;
          // 规则1：墙宽方向（未锁通缝）边缘裁砖 < 1/3 提醒
          const minX = Math.min(entry.x.cutLeft != null ? entry.x.cutLeft : Infinity, entry.x.cutRight != null ? entry.x.cutRight : Infinity);
          if (minX < wDims.x / 3) entry.statuses.push({ kind:"warn", text:`墙宽方向边缘裁砖 < 1/3（约 ${Math.round(minX)}mm），请现场定夺` });
          else if (usedOffset) entry.statuses.push({ kind:"ok", text:"已与地砖错缝对齐（半砖偏移，墙地缝错开）" });
        }
        // 规则4：墙宽方向裁砖列数
        const cutX = entry.x.segments.filter(seg => seg.cut).length;
        if (cutX > 2) entry.statuses.push({ kind:"warn", text:"墙宽方向裁砖超过 2 列，建议调整砖规格或起铺" });
        if (cutY > 2) entry.statuses.push({ kind:"warn", text:"墙高方向裁砖超过 2 排，建议调整砖规格或起铺" });
      }
      scene.walls[wall.id] = entry;
    }
    return scene;
  };

  const nameOfEdge = (e) => ({ front:"前边", back:"后边", left:"左边", right:"右边" }[e] || e);

  /* 整屋展开图（unfolded net）的几何布局：地面居中，四面墙按 alignEdge 围在四周。
   * 纯函数、不碰 canvas：只算“每个矩形在画布上的像素位置/尺寸/旋转”，便于测试与复用。
   * side 映射：front=地面上方、back=下方、left=左、right=右。
   * 墙贴前/后时墙宽沿地面宽；贴左/右时墙“转 90°”，包围盒宽=墙高、高=墙宽。
   * 返回 { ok, scale, canvas:{w,h}, floor:{x,y,w,h}, walls:[{id,name,side,rot,x,y,w,h}] }（单位 px）。 */
  const computeRoomNet = (scene, state, opts = {}) => {
    const maxW   = opts.maxWidth  != null ? opts.maxWidth  : 1000;
    const maxH   = opts.maxHeight != null ? opts.maxHeight : 1400;
    const margin = opts.margin    != null ? opts.margin    : 40;
    const floor = scene && scene.floor;
    if (!floor || !floor.card || !(floor.card.w > 0) || !(floor.card.h > 0)) {
      return { ok:false, reason:"no-floor" };
    }
    const fw = floor.card.w, fh = floor.card.h;

    // 1) 给每面墙分配 side：优先用 alignEdge；未指定则按剩余空位补（避免两块挤同一边）
    const used = new Set();
    const order = ["front", "back", "left", "right"];
    const sideOf = (card) => {
      if (card.alignEdge && card.alignEdge !== "none" && !used.has(card.alignEdge)) {
        used.add(card.alignEdge); return card.alignEdge;
      }
      for (const s of order) if (!used.has(s)) { used.add(s); return s; }
      return null; // 超过四面则放不下，跳过
    };

    // 2) 各墙在“毫米坐标系”里的包围盒（地面占 [0,fw]×[0,fh]）
    const wallsMM = [];
    for (const c of state.cards) {
      if (c.type !== "wall") continue;
      const e = scene.walls && scene.walls[c.id];
      if (!e || !(c.w > 0) || !(c.h > 0)) continue;
      const side = sideOf(c);
      if (!side) continue;
      const rot = (side === "left" || side === "right");
      const w = rot ? c.h : c.w;   // 包围盒宽（mm）
      const h = rot ? c.w : c.h;   // 包围盒高（mm）
      // 记录贴墙那根轴（沿地面边的轴）的相位/步距，用于左/右墙旋转后把砖缝对齐地面边缝
      const xAxis = (e && e.x) ? e.x : null;
      wallsMM.push({ id:c.id, name:c.name, side, rot, w, h,
        xphase: xAxis ? xAxis.phase : null, xstep: xAxis ? xAxis.step : null });
    }

    // 3) 整体包围盒
    let minX = 0, maxX = fw, minY = 0, maxY = fh;
    for (const w of wallsMM) {
      if (w.side === "front") minY = Math.min(minY, -w.h);
      if (w.side === "back")  maxY = Math.max(maxY, fh + w.h);
      if (w.side === "left")  minX = Math.min(minX, -w.w);
      if (w.side === "right") maxX = Math.max(maxX, fw + w.w);
    }
    const bboxW = maxX - minX, bboxH = maxY - minY;

    // 4) 缩放：整张图塞进 maxW×maxH（留 margin）
    const scale = Math.min((maxW - 2 * margin) / bboxW, (maxH - 2 * margin) / bboxH);
    const shiftX = -minX * scale + margin, shiftY = -minY * scale + margin;
    const px = (mm) => mm * scale;
    const X = (mmx) => px(mmx) + shiftX;
    const Y = (mmy) => px(mmy) + shiftY;

    // 5) 地面与每面墙的像素矩形（left/right 已转 90°，w/h 是包围盒尺寸）
    const floorRect = { x:X(0), y:Y(0), w:px(fw), h:px(fh) };
    const walls = wallsMM.map(w => {
      let x, y;
      if (w.side === "front") { x = (fw - w.w) / 2; y = -w.h; }
      else if (w.side === "back")  { x = (fw - w.w) / 2; y = fh; }
      else if (w.side === "left" || w.side === "right") {
        x = (w.side === "left") ? -w.w : fw;
        // 左/右墙：墙长(c.w = 包围盒高 w.h)沿地面那条竖边(fh)。renderRoomNet 把墙转 90°，
        // 旋转让砖缝方向与地面反向，故墙x相位需“镜像”——墙缝落在地面边缝上的充要条件是
        //   y ≡ (2·phaseX − w.h) (mod stepX)
        // 但“相位锁”只保证起点相位一致；带缝宽时模块(墙 800+2 / 地 400+2)无法真正整周期重合，
        // 若直接套用会把整面墙从地面边整体挪偏（如本例挪 392mm）。正确做法：墙根必须贴着
        // 地面边 [0, fh]（y_mm ∈ [fh−w.h, 0]），在此前提下再取最接近的相位锁值，越界就夹回边界。
        if (w.xphase != null && w.xstep > 0) {
          const y0 = ((2 * w.xphase - w.h) % w.xstep + w.xstep) % w.xstep; // 落在 [0, stepX)
          const k = Math.round((0 - y0) / w.xstep);          // 最接近“贴地面顶边角(y=0)”的相位锁值
          const yc = y0 + k * w.xstep;
          const lo = fh - w.h, hi = 0;                        // 墙根必须覆盖地面边的合法区间
          y = Math.min(hi, Math.max(lo, yc));                // 夹到合法区间：墙根贴地、不悬空、也不被相位锁整体挪偏
        } else {
          y = 0; // 兜底：相位缺失也贴顶边，至少不悬空错位
        }
      }
      return { id:w.id, name:w.name, side:w.side, rot:w.rot, x:X(x), y:Y(y), w:px(w.w), h:px(w.h) };
    });

    return {
      ok:true, scale,
      canvas:{ w: Math.round(px(bboxW) + 2 * margin), h: Math.round(px(bboxH) + 2 * margin) },
      floor: floorRect, walls,
    };
  };

  return { deriveEdges, laidDims, compatible, layoutAxis, computeScene, nameOfEdge, computeRoomNet,
           /* 地漏找坡（方案 2.4 / 4.3）：已实现 4 个，其余待实现见方案 4.2 */
           drainToDiagram, drainShape, lowDist, slopeZones, slopeHeightAt,
           rideGap, rideReport,
           drainRidgeLines, drainOpening, cutRectByLines, cutRectByHole,
           pickCrossPhase, drainCutPlan, drainAdvice };
})();
if (typeof module !== "undefined" && module.exports) module.exports = Engine;
/*ENGINE-END*/

/* 地面卡片的"地漏与找坡"默认值（方案第 3 节；缺任一字段都有兜底，老存档零影响） */
function defaultDrain(){
  return {
    on:false,             // 总开关：不做找坡时下面全都不参与计算
    kind:"square",        // square 方形 | round 圆形 | concealed 回字/隐形 | linear 长条
    fromLeft:null,        // 地漏中心 离"左墙" mm（师傅拿卷尺量的两个数）
    fromBack:null,        // 地漏中心 离"后墙" mm

    len:300, wide:64,     // 长条：面板长 / 宽

    against:null,         // 长条贴哪条边：null 房间中间（双坡）
    shower:"hand",        // 长条校核用：hand 手持 12 / rain 大顶喷 25 / both 顶喷+手持 40
    drop:10,              // 坡度：每 1000mm 降几 mm（7~14 → 合成 1%~2%）
    cutStyle:"auto",      // auto | hole 单砖套割 | corner 回字对角切
    fitRidges:true,       // 点状：微调起铺点，让十字分水线压在砖缝上
    fitEdges:true,        // 长条：微调起铺点，让长条边缘压在砖缝上

  };
}

function load(){

    if (!d || !d.settings || !Array.isArray(d.cards)) return null;
    return d;
  } catch(e){ return null; }
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const parseMM = (v) => {
  const s = String(v == null ? "" : v).trim();
  if (!/^\d+$/.test(s)) return NaN;
  return parseInt(s, 10);
};
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* 校验：返回错误消息数组 */
function validateCard(card){
  const errs = [];
  if (card.type === "wall") {
    const W = card.w, H = card.h;
    if (card.door.on) {
      const d = card.door;
      if ([d.left, d.width, d.height].some(v => !(v > 0))) errs.push("门洞三个数都要填正整数（毫米）");
      else {
        if (W > 0 && d.left + d.width > W) errs.push("门左边距离 + 门宽超过了墙宽");
        if (H > 0 && d.height > H) errs.push("门高超过了墙高");
      }
    }
    if (card.win.on) {
      const n = card.win;
      if ([n.left, n.sill, n.width, n.height].some(v => !(v > 0))) errs.push("窗户四个数都要填正整数（毫米）");
      else {
        if (!(n.sill > 0)) errs.push("窗台离地高度必须大于 0（不做落地窗）");
        if (W > 0 && n.left + n.width > W) errs.push("窗左边距离 + 窗宽超过了墙宽");
        // 窗户可高于标注墙高：标注墙高是“需贴砖尺寸”，真实墙往往更高，窗顶可进入贴砖区上方，不报错
      }
    }
    card.cols.forEach((c, i) => {
      if (c.width == null && c.depth == null) return; // 刚添加还没填：先不报错，图上也不画
      const L = effLeft(c, card);
      const needLeft = !c.corner;                 // 贴角时离左自动算，不要求手填
      const nums = needLeft ? [c.left, c.width, c.depth] : [c.width, c.depth];
      if (nums.some(v => !(v > 0))) errs.push(`立柱 ${i+1} ${needLeft ? "三个数" : "宽和深"}都要填正整数（毫米）`);
      else       if (W > 0 && L + c.width > W) errs.push(`立柱 ${i+1} 离左距离 + 宽度超过了墙宽`);
    });
  }
  if (card.type === "floor" && card.drain && card.drain.on) {
    const d = card.drain, W = card.w, H = card.h;
    if (!(d.drop >= 5 && d.drop <= 21)) errs.push("坡度填 5~21（每米降几毫米；低于 5 排水太慢，高于 21 站不住脚）");
    if (!(d.fromLeft > 0) || !(d.fromBack > 0)) errs.push("地漏位置两个都要填：离左墙、离后墙（毫米）");
    if (d.kind === "linear") {
      if (!(d.len >= 200 && d.len <= 2000)) errs.push("长条长度填 200~2000 毫米");
      if (!(d.wide >= 20 && d.wide <= 200)) errs.push("长条宽度填 20~200 毫米");
      if (d.len > 0 && d.wide > 0 && !(d.len > d.wide)) errs.push("长条长度要大于宽度");
      if (d.against) {   // 槽体要有地方放：中心线到墙 ≥ 宽/2 + 20
        const dist = { back:d.fromBack, front:(H - d.fromBack), left:d.fromLeft, right:(W - d.fromLeft) }[d.against];
        const need = (d.wide || 64) / 2 + 20;
        if (dist != null && W > 0 && H > 0 && dist < need)
          errs.push(`长条离墙只有 ${Math.round(dist)}mm，槽体至少要 ${Math.round(need)}mm，装不下`);
      }
    } else if (!(d.size >= 50 && d.size <= 300)) {
      errs.push("地漏边长/直径填 50~300 毫米");
    }
    // 洞口（含留缝）必须完整落在地面内，且离最近的墙 ≥ gap+20（方案第 3 节）
    if (W > 0 && H > 0 && d.fromLeft > 0 && d.fromBack > 0) {
      const o = (() => {
        const sh = Engine.drainShape(d, card, state.doorEdge);
        return Engine.drainOpening(sh);
      })();
      const clear = Math.min(o.x, o.y, W - (o.x + o.w), H - (o.y + o.h));
      if (clear < (d.gap || 3) + 20)
        errs.push(`地漏离最近的墙只有 ${Math.round(clear)}mm，至少要留出 ${Math.round((d.gap || 3) + 20)}mm（装不下、也切不了）`);
    }
  }
  return errs;
}

function renderSettings(){
  const s = state.settings;
  // 墙砖 chips
  const wc = $("#wallChips"); wc.innerHTML = "";
  WALL_PRESETS.forEach(([a,b]) => {
    const key = `${a}×${b}`;
    const btn = el("button", "chip" + (s.wallTile && s.wallTile.preset === key ? " on" : ""), key);
    btn.onclick = () => { s.wallTile = { preset:key, w:a, h:b }; save(); renderSettings(); update(); };
    wc.appendChild(btn);
  });
  const wCustom = el("button", "chip" + (s.wallTile && s.wallTile.preset === "custom" ? " on" : ""), "自定义");
  wCustom.onclick = () => {
    if (!s.wallTile || s.wallTile.preset !== "custom") s.wallTile = { preset:"custom", w:null, h:null };
    save(); renderSettings(); update();
  };
  wc.appendChild(wCustom);
  $("#wallCustom").classList.toggle("show", !!(s.wallTile && s.wallTile.preset === "custom"));
  $("#wallCW").value = s.wallTile && s.wallTile.preset === "custom" && s.wallTile.w ? s.wallTile.w : "";
  $("#wallCH").value = s.wallTile && s.wallTile.preset === "custom" && s.wallTile.h ? s.wallTile.h : "";

  // 地砖 chips
  const fc = $("#floorChips"); fc.innerHTML = "";
  FLOOR_PRESETS.forEach(([a,b]) => {
    const key = `${a}×${b}`;
    const btn = el("button", "chip" + (s.floorTile && s.floorTile.preset === key ? " on" : ""), key);
    btn.onclick = () => { s.floorTile = { preset:key, w:a, h:b }; save(); renderSettings(); update(); };
    fc.appendChild(btn);
  });
  const fCustom = el("button", "chip" + (s.floorTile && s.floorTile.preset === "custom" ? " on" : ""), "自定义");
  fCustom.onclick = () => {
    if (!s.floorTile || s.floorTile.preset !== "custom") s.floorTile = { preset:"custom", w:null, h:null };
    save(); renderSettings(); update();
  };
  fc.appendChild(fCustom);
  $("#floorCustom").classList.toggle("show", !!(s.floorTile && s.floorTile.preset === "custom"));
  $("#floorCW").value = s.floorTile && s.floorTile.preset === "custom" && s.floorTile.w ? s.floorTile.w : "";
  $("#floorCH").value = s.floorTile && s.floorTile.preset === "custom" && s.floorTile.h ? s.floorTile.h : "";

  // 分段按钮
  $$("#dirSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === s.direction));
  $$("#startSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === s.startMode));
  $$("#groutSeg button").forEach(b => b.classList.toggle("on", parseFloat(b.dataset.v) === s.grout));
  $("#wallOverFloor").checked = (s.wallOverFloor !== false);

  // 摘要行
  const wt = s.wallTile ? (s.wallTile.preset === "custom"
      ? (s.wallTile.w && s.wallTile.h ? `${s.wallTile.w}×${s.wallTile.h}` : "自定义未填全")
      : s.wallTile.preset) : "未选";
  const ft = s.floorTile ? (s.floorTile.preset === "custom"
      ? (s.floorTile.w && s.floorTile.h ? `${s.floorTile.w}×${s.floorTile.h}` : "自定义未填全")
      : s.floorTile.preset) : "未选";
  $("#settingsSummary").innerHTML =
    `墙砖 <b>${wt}</b> · 地砖 <b>${ft}</b> · ${s.direction === "horizontal" ? "横铺" : "竖铺"} · ${s.startMode === "center" ? "居中" : "靠边"} · 缝 <b>${s.grout}mm</b>`;
}

function bindSettings(){
  $("#settingsToggle").onclick = () => {

  };

  custBind("#floorCW", "#floorCH", "floorTile");

  $$("#startSeg button").forEach(b => b.onclick = () => { state.settings.startMode = b.dataset.v; save(); renderSettings(); update(); });
  $$("#groutSeg button").forEach(b => b.onclick = () => { state.settings.grout = parseFloat(b.dataset.v); save(); renderSettings(); update(); });

function featBlock(card){
  // 门洞
  const door = el("details", "feat");
  const ds = el("summary"); ds.appendChild(el("span", "feat-name", "门洞"));
  const dv = el("span", "feat-val"); dv.dataset.fv = "door"; ds.appendChild(dv);
  door.appendChild(ds);
  const db = el("div", "feat-body");
  const sw = el("label", "switch-row");
  sw.appendChild(el("span", null, "这面墙有门（从地面开始）"));

  cb.addEventListener("change", () => { card.door.on = cb.checked; save(); update(); });
  sw.appendChild(cb); db.appendChild(sw);

/* 地面卡片的"地漏与找坡"折叠块（照 featBlock 的写法：details + _sync 回显）
 * 顺序：开关 → 造型四选一 → 只显示该造型要填的字段 → 离左 / 离后 / 每米降几毫米 */
function drainBlock(card){
  const d = card.drain;
  const box = el("details", "feat");
  const sm = el("summary"); sm.appendChild(el("span", "feat-name", "地漏与找坡"));
  const dv = el("span", "feat-val"); dv.dataset.fv = "drain"; sm.appendChild(dv);
  box.appendChild(sm);

  const body = el("div", "feat-body");
  const sw = el("label", "switch-row");
  sw.appendChild(el("span", null, "这间地面要找坡（整间往地漏斜）"));
  const cb = el("input", "switch"); cb.type = "checkbox"; cb.checked = !!d.on;
  cb.addEventListener("change", () => { d.on = cb.checked; save(); renderCards(); update(); });
  sw.appendChild(cb); body.appendChild(sw);

  const inputs = el("div", "feat-inputs" + (d.on ? " show" : ""));

  const segRow = (label, items, cur, onPick, mini) => {
    const row = el("div", "align-row");
    row.appendChild(el("span", "set-label", label));
    const seg = el("div", mini ? "seg mini" : "seg");
    items.forEach(([v, t]) => {
      const b = el("button", cur === v ? "on" : "", t);
      b.onclick = () => { onPick(v); save(); renderCards(); update(); };
      seg.appendChild(b);
    });
    row.appendChild(seg); inputs.appendChild(row);
  };
  // 造型四选一（改造型要重排字段 → renderCards）
  segRow("地漏造型", [["square","方形"],["round","圆形"],["concealed","回字"],["linear","长条"]],
    d.kind, (v) => { d.kind = v; });
  if (d.kind === "linear") {
    segRow("长条装在哪", [["back","贴后墙"],["front","贴前墙"],["left","贴左墙"],["right","贴右墙"],["","房间中间"]],
      d.against || "", (v) => { d.against = v || null; }, true);
    segRow("花洒（校核排水量）", [["hand","手持"],["rain","大顶喷"],["both","顶喷+手持"]],
      d.shower, (v) => { d.shower = v; }, true);
  }

  const fields = d.kind === "linear"
    ? [["len","长条长度（mm）","如 300~1524"], ["wide","长条宽度（mm）","如 64"], ["gap","留缝（mm）","如 3"]]
    : [["size","边长 / 直径（mm）","如 100"], ["gap","套割留缝（mm）","如 3"]];
  fields.push(["fromLeft","离左墙（mm）","如 1000"], ["fromBack","离后墙（mm）","如 750"],
              ["drop","每米降几毫米（mm/m）","7~14 常见"]);
  fields.forEach(([k, label, ph]) => {
    const f = el("label", "field"); f.appendChild(el("span", null, label));
    const inp = el("input"); inp.type = "text"; inp.inputMode = "numeric"; inp.placeholder = ph;
    inp.value = d[k] != null ? d[k] : "";
    inp.addEventListener("input", () => { d[k] = parseMM(inp.value); save(); update(); });
    f.appendChild(inp); inputs.appendChild(f);
  });

  // 让分水线 / 长条边缘压在砖缝上（默认开；压上就一块砖都不用管）
  const fitRow = el("label", "switch-row");
  fitRow.appendChild(el("span", null, d.kind === "linear" ? "微调起铺点，让长条边缘压在砖缝上"
                                                          : "微调起铺点，让分水线压在砖缝上"));
  const fcb = el("input", "switch"); fcb.type = "checkbox";
  fcb.checked = d.kind === "linear" ? d.fitEdges !== false : d.fitRidges !== false;
  fcb.addEventListener("change", () => {
    if (d.kind === "linear") d.fitEdges = fcb.checked; else d.fitRidges = fcb.checked;
    save(); update();
  });
  fitRow.appendChild(fcb); inputs.appendChild(fitRow);

  body.appendChild(inputs); box.appendChild(body);

  box._sync = () => {
    inputs.classList.toggle("show", !!d.on);
    const name = { square:"方形", round:"圆形", concealed:"回字", linear:"长条" }[d.kind] || "方形";
    const bits = [d.kind === "linear" ? `${name} ${d.len || "?"}×${d.wide || "?"}` : `${name} ${d.size || "?"}`];
    if (d.fromLeft > 0 && d.fromBack > 0) bits.push(`离左 ${d.fromLeft} / 离后 ${d.fromBack}`);
    if (d.drop > 0) bits.push(`每米降 ${d.drop}mm`);
    dv.textContent = d.on ? bits.join("，") : "无";
    dv.classList.toggle("lit", !!d.on);
  };
  return { node:box, sync:box._sync };
}

/* ============================================================
 * 更新：计算 + 画图 + 状态（不动输入框，不打断打字）
 * ============================================================ */
function update(){
  // 自定义规格合法性提示放在摘要里即可，图只认有效值
  const scene = Engine.computeScene(state);
  $$(".card").forEach(box => {
    const card = state.cards.find(c => c.id === box.dataset.id);
    if (!card) return;
    const sub = $("[data-sub]", box);
    const sts = $("[data-status]", box);
    const empty = $("[data-empty]", box);
    const canvas = $("[data-canvas]", box);

    // 尺寸文字
    sub.textContent = (card.w > 0 && card.h > 0)
      ? `${card.w} × ${card.h} mm`
      : "尺寸还没填全";

    // 校验消息
    const msgs = [];
    const errs = validateCard(card);
    errs.forEach(t => msgs.push({ kind:"error", text:t }));

    const entry = card.type === "wall" ? scene.walls[card.id] : null;
    if (card.type === "wall" && entry) entry.statuses.forEach(st => msgs.push(st));
    if (card.type === "floor" && scene.floor) {
      scene.floor.statuses.forEach(st => msgs.push(st));
      const slp = scene.floor.slope;                       // 找坡的选型/校核提示（不改排版，只提示）
      if (slp && slp.advice && slp.advice.items) slp.advice.items.forEach(it => msgs.push(it));
      if (columnFootprints(scene, state).length) {
        msgs.push({ kind:"info", text:"立柱压在地面上：与柱脚相叠的地砖要裁切，图上红字是剩余块实测尺寸" });
      }
    }

    // 尺寸本身的合法性
    let sizeOk = card.w > 0 && card.h > 0;
    if (card.w != null && !(card.w >= 100 && card.w <= 10000)) { msgs.push({kind:"error", text:"宽要在 100–10000 毫米之间"}); sizeOk = false; }
    if (card.h != null && !(card.h >= 100 && card.h <= 10000)) { msgs.push({kind:"error", text:"高要在 100–10000 毫米之间"}); sizeOk = false; }
    if (card.w == null || card.h == null) sizeOk = false;

    const tileOk = card.type === "floor" ? !!state.settings.floorTile : !!state.settings.wallTile;
    if (sizeOk && !tileOk) msgs.push({kind:"info", text: card.type === "floor" ? "在顶部选好地砖规格后出图" : "在顶部选好墙砖规格后出图"});

    sts.innerHTML = "";
    msgs.forEach(m => sts.appendChild(el("div", "st " + m.kind, m.text)));

    // 画图
    if (sizeOk && tileOk) {
      empty.style.display = "none";
      canvas.style.display = "block";
      if (card.type === "floor") drawFloor(canvas, card, scene);
      else drawWall(canvas, card, entry, scene);
    } else {
      canvas.style.display = "none";
      empty.style.display = "block";
      empty.textContent = (card.w == null && card.h == null) ? "填好尺寸后这里出图" :
        (card.w == null || card.h == null) ? "还差一条边没填" : "尺寸填好后这里出图";
    }
  });
  renderRoomNet(scene);
  renderRoom3D(scene);
  hookFeatSync();
}
