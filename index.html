/* ============================================================
 * Canvas 绘图
 * ============================================================ */
function setupCanvas(canvas, wMM, hMM){
  const maxW = canvas.parentElement.clientWidth || 320;
  const maxH = 460;
  const s = Math.min(maxW / wMM, maxH / hMM);
  const cssW = Math.max(1, Math.round(wMM * s)), cssH = Math.max(1, Math.round(hMM * s));
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, s, cssW, cssH };
}

function paintTiles(ctx, xe, ye, s, W, H, minG){
  ctx.fillStyle = cssVar("--tile");
  if (xe.segments.dense || ye.segments.dense) { // 砖太小、数量太多：整体示意
    ctx.fillRect(0, 0, W || 0, H || 0);
    return;
  }
  // minG>0 时：砖缝在贴图里的像素宽小于 minG 会把每块砖四边内缩 minG/2，
  // 让砖缝至少 minG 像素，肉眼能看出砖的尺寸（仅 3D 传 >0，2D 不受影响）。
  const pad = (minG && minG > 0) ? minG / 2 : 0;
  for (const ys of ye.segments) {
    for (const xs of xe.segments) {
      const wpx = xs.width * s, hpx = ys.width * s;
      if (pad > 0 && pad * 2 < Math.min(wpx, hpx)) {
        ctx.fillRect(xs.start * s + pad, ys.start * s + pad, wpx - 2 * pad, hpx - 2 * pad);
      } else {
        ctx.fillRect(xs.start * s, ys.start * s, wpx, hpx);
      }
    }
  }
}

/* 在非整砖（裁砖）处标注其实测尺寸（毫米），方便现场下料。
 * 思路：只沿着“真实被裁的那条边”画一段尺寸线（两端短刻度 + 中间数值），
 * 让人一眼看出这个尺寸指的是哪条边、是宽还是高；不画高亮框，避免视觉杂乱。
 *   - 横向裁砖（某列为整块被裁的“宽”）：尺寸线横着画在贴边一侧
 *      左缘被裁 → 贴顶部；右缘被裁 → 贴底部
 *   - 纵向裁砖（某行为整块被裁的“高”）：尺寸线竖着画在贴边一侧
 *      上缘被裁 → 贴左边；下缘被裁 → 贴右边
 * 角部一张砖若被裁了两条边（如地面左上角），宽/高两个标签会挤在角落重叠；
 * 这里先把所有标签收集起来，再把重叠的成对沿“各自轴线”推开（宽标左右移、高标上下移），
 * 既分开又不脱离它所量的那条被裁边。
 * opts.skipHeight：墙砖高度方向整体允许高 1~2cm，故墙面预览不标高度方向裁砖尺寸。
 * map(lx, ly)：可选坐标变换，用于后墙（镜像绘制时把文字翻回正常视角）。 */
function paintCuts(ctx, xe, ye, s, W, H, map, opts){
  const M = map || ((x, y) => ({ x, y }));
  const cut = cssVar("--danger");
  const pad = 14; // 尺寸线离边缘的距离（也顺带避开地面的前/后/左/右徽标）
  const skipHeight = !!(opts && opts.skipHeight);
  ctx.save();
  ctx.font = '700 12px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const pillW = (txt) => ctx.measureText(txt).width + 10;
  const pill = (cx, cy, txt) => {
    const p = M(cx, cy);
    const w = pillW(txt);
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillRect(p.x - w/2, p.y - 10, w, 20);
    ctx.fillStyle = cut;
    ctx.fillText(txt, p.x, p.y);
  };

  // 1) 收集所有标注：主尺寸线两端点 + 标签默认落点
  const marks = [];
  const add = (axis, x0, x1, y0, y1, vx, vy, txt) =>
    marks.push({ axis, x0, x1, y0, y1, cx: vx, cy: vy, txt, w: pillW(txt), h: 20 });

  // 横向裁砖（宽）
  xe.segments.forEach((xs) => {
    if (!xs.cut) return;
    const x0 = xs.start * s, x1 = (xs.start + xs.width) * s;
    const cy = (xs.start < 1) ? pad : H - pad;         // 左缘→顶；右缘→底
    add("h", x0, x1, cy, cy, (x0 + x1) / 2, cy, String(Math.round(xs.width)));
  });
  // 纵向裁砖（高）；墙面预览可跳过
  if (!skipHeight) ye.segments.forEach((ys) => {
    if (!ys.cut) return;
    const y0 = ys.start * s, y1 = (ys.start + ys.width) * s;
    const cx = (ys.start < 1) ? pad : W - pad;         // 上缘→左；下缘→右
    add("v", cx, cx, y0, y1, cx, (y0 + y1) / 2, String(Math.round(ys.width)));
  });

  // 2) 先把贴边的标签夹回画布内（贴边标签会略微内移）
  marks.forEach((m) => {
    m.cx = Math.max(m.w / 2 + 2, Math.min(W - m.w / 2 - 2, m.cx));
    m.cy = Math.max(m.h / 2 + 2, Math.min(H - m.h / 2 - 2, m.cy));
  });
  // 3) 解角部重叠：宽标靠某角、高标也靠某角（如地面左上角）会挤在一起；
  //    把高标整体挪到对侧的那条垂直边（顶→右、底→左），等于"挪到另一个格子"，
  //    既一定不重叠，又仍然量的是同一段裁砖的高度，语义不变。
  const overlap = (a, b) =>
    Math.abs(a.cx - b.cx) < (a.w + b.w) / 2 &&
    Math.abs(a.cy - b.cy) < (a.h + b.h) / 2;
  const flipH = (m) => {
    const newCx = (m.x0 < W / 2) ? W - pad : pad;   // 对侧垂直边
    m.x0 = m.x1 = newCx;
    m.cx = Math.max(m.w / 2 + 2, Math.min(W - m.w / 2 - 2, newCx));
  };
  // 最多翻两次以防翻转后又撞上另一侧的宽标
  for (let pass = 0; pass < 2; pass++) {
    let any = false;
    for (let i = 0; i < marks.length; i++) for (let j = 0; j < marks.length; j++) {
      if (i === j) continue;
      const a = marks[i], b = marks[j];
      if (!(a.axis !== b.axis && overlap(a, b))) continue;
      // 翻动“高度”标；优先翻 b 是高度的；若 a 也是高度，翻 a 即可
      const h = a.axis === "v" ? a : b;
      flipH(h);
      any = true;
    }
    if (!any) break;
  }

  // 4) 画主尺寸线 + 两端短刻度 + 标签
  marks.forEach((m) => {
    ctx.strokeStyle = cut; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x0, m.y0); ctx.lineTo(m.x1, m.y1);            // 主尺寸线
    if (m.axis === "h") {
      ctx.moveTo(m.x0, m.y0 - 5); ctx.lineTo(m.x0, m.y0 + 5);  // 左端刻度
      ctx.moveTo(m.x1, m.y1 - 5); ctx.lineTo(m.x1, m.y1 + 5);  // 右端刻度
    } else {
      ctx.moveTo(m.x0 - 5, m.y0); ctx.lineTo(m.x0 + 5, m.y0);  // 上端刻度
      ctx.moveTo(m.x1 - 5, m.y1); ctx.lineTo(m.x1 + 5, m.y1);  // 下端刻度
    }
    ctx.stroke();
    pill(m.cx, m.cy, m.txt);
  });
  ctx.restore();
}

function dashedRect(ctx, x, y, w, h, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

function labelText(ctx, text, cx, cy, color){
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = '700 13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, cx, cy);
  ctx.restore();
}

const doorValid = (card) => card.door.on && card.door.left > 0 && card.door.width > 0 && card.door.height > 0
  && card.door.left + card.door.width <= card.w && card.door.height <= card.h;
const winValid = (card) => card.win.on && card.win.left > 0 && card.win.sill > 0 && card.win.width > 0 && card.win.height > 0
  && card.win.left + card.win.width <= card.w; // 窗宽在墙宽内即可；窗可高于标注墙高(真实墙更高)，不限制
/* 立柱的有效“离左”距离：贴角时由墙宽推算，自由时取存的值 */
function effLeft(c, card){
  if (c.corner === "left") return 0;
  if (c.corner === "right") return Math.max(0, (card.w || 0) - (c.width || 0));
  return (c.left != null && !isNaN(c.left)) ? c.left : 0;
}
const colValid = (c, card) => { const L = effLeft(c, card); return L >= 0 && c.width > 0 && c.depth > 0 && L + c.width <= (card.w || 0); };

/* 每面墙的物理方位（front/back/left/right），与整屋展开图/三维一致 */
function wallSideMap(st){
  const map = new Map();
  const used = new Set(); const order = ["front","back","left","right"];
  for (const card of st.cards) {
    if (card.type !== "wall" || !(card.w > 0) || !(card.h > 0)) continue;
    let s = null;
    if (card.alignEdge && card.alignEdge !== "none" && !used.has(card.alignEdge)) { used.add(card.alignEdge); s = card.alignEdge; }
    else { for (const q of order) if (!used.has(q)) { used.add(q); s = q; break; } }
    if (s) map.set(card.id, s);
  }
  return map;
}

/* 公共（角部）立柱：贴在墙角的立柱同时属于相邻那面墙。
 * 例如 A墙（front）贴左 与 C墙（left）贴右 是同一个角柱，应当两面墙都画。
 * 下表给出“(墙方位, 贴左/右) → 共享它的相邻墙(方位, 贴左/右)”，互为对称。 */
const SIDE_MIRROR = {
  "front-left":["left","right"],  "front-right":["right","left"],
  "back-left":["right","right"],   "back-right":["left","left"],
  "left-left":["back","right"],    "left-right":["front","left"],
  "right-left":["front","right"],  "right-right":["back","left"],
};
/* 该墙在“墙面显示”时应画的全部立柱：自有 + 相邻墙角部立柱镜像过来的（去重）。
 * 俯视脚印/地面阴影仍由各墙自有立柱负责，避免出现两份重叠的柱脚。 */
function publicColsFor(card, st){
  st = st || state;
  const map = wallSideMap(st);
  const my = map.get(card.id);
  if (!my) return card.cols.slice();
  const out = card.cols.slice();
  for (const other of st.cards) {
    if (other.id === card.id || other.type !== "wall") continue;
    const os = map.get(other.id); if (!os) continue;
    for (const c of other.cols) {
      if (c.corner !== "left" && c.corner !== "right") continue;   // 只有贴角立柱才算公共立柱
      const m = SIDE_MIRROR[os + "-" + c.corner];
      if (m && m[0] === my) {
        const dup = out.some(rc => rc.corner === m[1] && rc.width === c.width && rc.depth === c.depth);
        if (!dup) out.push({ corner:m[1], width:c.width, depth:c.depth, shared:true });
      }
    }
  }
  return out;
}

/* 立柱在地面上的"脚印"（俯视矩形，毫米）：立柱压在地面上，地砖要围着它裁。
 * side 分配与镜像约定和三维图完全一致（地面阴影必须和柱子盒子对上）。 */
function columnFootprints(scene, state){
  const f = scene && scene.floor;
  if (!f || !f.card || !(f.card.w > 0) || !(f.card.h > 0)) return [];
  const FW = f.card.w, FH = f.card.h;
  const used = new Set(); const order = ["front", "back", "left", "right"];
  const out = [];
  for (const card of state.cards) {
    if (card.type !== "wall") continue;
    if (!(card.w > 0) || !(card.h > 0)) continue;
    let side = null;
    if (card.alignEdge && card.alignEdge !== "none" && !used.has(card.alignEdge)) { used.add(card.alignEdge); side = card.alignEdge; }
    else { for (const s of order) if (!used.has(s)) { used.add(s); side = s; break; } }
    if (!side) continue;
    const flip = !!(card.door && card.door.on);
    const across = (side === "front" || side === "back") ? FH : FW;
    card.cols.forEach((c) => {
      if (!colValid(c, card)) return;
      const L = effLeft(c, card);
      const t0 = flip ? Math.max(0, card.w - L - c.width) : L;
      const d = Math.min(c.depth, across * 0.9);
      if (side === "front")      out.push({ x:(FW - card.w) / 2 + t0, y:0,      w:c.width, h:d });
      else if (side === "back")  out.push({ x:(FW - card.w) / 2 + t0, y:FH - d, w:c.width, h:d });
      else if (side === "left")  out.push({ x:0,      y:(FH - card.w) / 2 + t0, w:d, h:c.width });
      else                       out.push({ x:FW - d, y:(FH - card.w) / 2 + t0, w:d, h:c.width });
    });
  }
  return out;
}

/* 地面图上的柱脚色块（俯视）：柱色填充 + 实线框 */
function paintFootprint(ctx, r, s, label){
  const x = r.x * s, y = r.y * s, w = r.w * s, h = r.h * s;
  ctx.fillStyle = cssVar("--column");
  ctx.fillRect(x, y, w, h);
  ctx.save();
  ctx.strokeStyle = cssVar("--ink-soft"); ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
  ctx.restore();
  if (label && w > 20 && h > 20) labelText(ctx, label, x + w / 2, y + h / 2, cssVar("--ink"));
}

/* 柱脚压到的砖要裁切：红字标出"砖缝到柱边"剩下那块的实测尺寸，现场照着下料。
 * 只对真正被柱边穿过的砖格标（柱边恰好落在缝上 = 不用裁，不标）。 */
function paintFootprintCuts(ctx, r, xe, ye, s, W, H){
  if (!xe || !ye || xe.segments.dense || ye.segments.dense) return;
  const cut = cssVar("--danger");
  const pad = 14;
  const X0 = r.x, X1 = r.x + r.w, Y0 = r.y, Y1 = r.y + r.h;
  const FWmm = W / s, FHmm = H / s;
  ctx.save();
  ctx.font = '700 12px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const pillW = (t) => ctx.measureText(t).width + 10;
  const marks = [];
  xe.segments.forEach((seg) => {
    const s0 = seg.start, s1 = seg.start + seg.width;
    if (s0 < X0 - 0.5 && s1 > X0 + 0.5) marks.push({ axis:"h", a:s0, b:X0, v:X0 - s0 });
    if (s0 < X1 - 0.5 && s1 > X1 + 0.5) marks.push({ axis:"h", a:X1, b:s1, v:s1 - X1 });
  });
  ye.segments.forEach((seg) => {
    const s0 = seg.start, s1 = seg.start + seg.width;
    if (s0 < Y0 - 0.5 && s1 > Y0 + 0.5) marks.push({ axis:"v", a:s0, b:Y0, v:Y0 - s0 });
    if (s0 < Y1 - 0.5 && s1 > Y1 + 0.5) marks.push({ axis:"v", a:Y1, b:s1, v:s1 - Y1 });
  });
  // 每个标签的默认落点（尺寸线 + 数字一起记，方便整体挪动）
  marks.forEach((mk) => {
    mk.txt = String(Math.round(mk.v));
    mk.w = pillW(mk.txt); mk.h = 20;
    if (mk.axis === "h") {
      const ly = (Y1 < FHmm - 1) ? Y1 * s + pad : Y0 * s - pad;  // 贴下边时改画在柱脚上方
      mk.x0 = mk.a * s; mk.x1 = mk.b * s; mk.y0 = mk.y1 = ly; mk.cx = (mk.x0 + mk.x1) / 2; mk.cy = ly;
    } else {
      const lx = (X1 < FWmm - 1) ? X1 * s + pad : X0 * s - pad;  // 贴右边时改画在柱脚左方
      mk.y0 = mk.a * s; mk.y1 = mk.b * s; mk.x0 = mk.x1 = lx; mk.cx = lx; mk.cy = (mk.y0 + mk.y1) / 2;
    }
  });
  // 避让：两个标签矩形相叠时，沿各自方向推开（横标上下走、竖标左右走，
  // 混合相叠时横标往远离柱脚的上/下推、竖标往远离柱脚的左/右推），尺寸线跟着走，多轮直到分开
  const hit = (a, b) =>
    Math.abs(a.cx - b.cx) * 2 < a.w + b.w && Math.abs(a.cy - b.cy) * 2 < a.h + b.h;
  for (let pass = 0; pass < 6; pass++) {
    let any = false;
    for (let i = 0; i < marks.length; i++) for (let j = i + 1; j < marks.length; j++) {
      const a = marks[i], b = marks[j];
      if (!hit(a, b)) continue;
      any = true;
      const dy = (a.h + b.h) / 2 - Math.abs(a.cy - b.cy) + 4;
      const dx = (a.w + b.w) / 2 - Math.abs(a.cx - b.cx) + 4;
      const shift = (m, amt) => {
        if (m.axis === "h") { m.cy += amt; m.y0 += amt; m.y1 += amt; }
        else { m.cx += amt; m.x0 += amt; m.x1 += amt; }
      };
      if (a.axis === "h" && b.axis === "h") { const d = a.cy <= b.cy ? -1 : 1; shift(a, d * dy / 2); shift(b, -d * dy / 2); }
      else if (a.axis === "v" && b.axis === "v") { const d = a.cx <= b.cx ? -1 : 1; shift(a, d * dx / 2); shift(b, -d * dx / 2); }
      else {
        const hM = a.axis === "h" ? a : b, vM = a.axis === "h" ? b : a;
        shift(hM, (Y1 < FHmm - 1 ? 1 : -1) * dy / 2);   // 横标往柱脚外侧（下/上）推
        shift(vM, (X1 < FWmm - 1 ? 1 : -1) * dx / 2);   // 竖标往柱脚外侧（右/左）推
      }
    }
    if (!any) break;
  }
  marks.forEach((mk) => {
    mk.cx = Math.max(mk.w / 2 + 2, Math.min(W - mk.w / 2 - 2, mk.cx));
    mk.cy = Math.max(12, Math.min(H - 12, mk.cy));
    ctx.strokeStyle = cut; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mk.x0, mk.y0); ctx.lineTo(mk.x1, mk.y1);
    if (mk.axis === "h") { ctx.moveTo(mk.x0, mk.y0 - 5); ctx.lineTo(mk.x0, mk.y0 + 5); ctx.moveTo(mk.x1, mk.y1 - 5); ctx.lineTo(mk.x1, mk.y1 + 5); }
    else { ctx.moveTo(mk.x0 - 5, mk.y0); ctx.lineTo(mk.x0 + 5, mk.y0); ctx.moveTo(mk.x1 - 5, mk.y1); ctx.lineTo(mk.x1 + 5, mk.y1); }
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fillRect(mk.cx - mk.w / 2, mk.cy - 10, mk.w, 20);
    ctx.fillStyle = cut; ctx.fillText(mk.txt, mk.cx, mk.cy);
  });
  ctx.restore();
}

/* 画"往外凸"的立柱色带：中间受光提亮、两侧转折面压暗、实线框。
 * 门/窗用虚线框表示"凹进去的洞口"；立柱用实线框 + 明暗表示"凸出来的墩"。 */
function paintColumnBand(ctx, x, w, h){
  ctx.fillStyle = cssVar("--column");
  ctx.fillRect(x, 0, w, h);
  const edge = Math.max(2, Math.min(8, w * 0.16));
  ctx.fillStyle = "rgba(255,255,255,0.14)";            // 正面中间提亮
  ctx.fillRect(x + edge, 0, w - edge * 2, h);
  ctx.fillStyle = "rgba(0,0,0,0.18)";                  // 左右两侧压暗，显出凸出的转折
  ctx.fillRect(x, 0, edge, h);
  ctx.fillRect(x + w - edge, 0, edge, h);
  ctx.save();
  ctx.strokeStyle = cssVar("--ink-soft"); ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.75, 0.75, w - 1.5, h - 1.5);
  ctx.restore();
}

/* 墙面的门/窗/立柱（色块 + 虚线框 + 文字）。drawWall 与 3D 离屏渲染共用，
 * 这样 3D 墙面上也能看到门、窗、立柱的位置。 */
function paintWallFeatures(ctx, card, s){
  const soft = cssVar("--ink-soft");
  // 门洞（从地面起）
  if (doorValid(card)) {
    const d = card.door;
    const x = d.left * s, y = (card.h - d.height) * s, w = d.width * s, h = d.height * s;
    ctx.fillStyle = cssVar("--open"); ctx.fillRect(x, y, w, h);
    dashedRect(ctx, x, y, w, h, soft);
    labelText(ctx, "门", x + w/2, y + h/2, soft);
  }
  // 窗户（悬空）
  if (winValid(card)) {
    const n = card.win;
    const x = n.left * s, y = (card.h - n.sill - n.height) * s, w = n.width * s, h = n.height * s;
    ctx.fillStyle = cssVar("--open"); ctx.fillRect(x, y, w, h);
    dashedRect(ctx, x, y, w, h, soft);
    labelText(ctx, "窗", x + w/2, y + h/2, soft);
  }
  // 包管立柱（通顶、往外凸的墩）——含相邻墙共享的角部立柱
  publicColsFor(card).forEach((c, i) => {
    if (!colValid(c, card)) return;
    const x = effLeft(c, card) * s, w = c.width * s, h = card.h * s;
    paintColumnBand(ctx, x, w, h);
    ctx.save();
    ctx.fillStyle = cssVar("--ink");
    ctx.font = '700 12px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // 竖排文字
    const tx = x + w/2, ty = h/2 - 20;
    `立柱${i+1}`.split("").forEach((ch, k) => ctx.fillText(ch, tx, ty + k * 15));
    ctx.restore();
  });
}

function drawWall(canvas, card, entry){
  if (!entry || !entry.x || !entry.y) return;
  const { ctx, s, cssW, cssH } = setupCanvas(canvas, card.w, card.h);
  ctx.fillStyle = cssVar("--joint");
  ctx.fillRect(0, 0, cssW, cssH);
  paintTiles(ctx, entry.x, entry.y, s, cssW, cssH);

  paintWallFeatures(ctx, card, s);
  paintCuts(ctx, entry.x, entry.y, s, cssW, cssH, null, { skipHeight: true });
}

function drawFloor(canvas, card, scene){
  const f = scene.floor;
  if (!f) return;
  const { ctx, s, cssW, cssH } = setupCanvas(canvas, card.w, card.h);
  ctx.fillStyle = cssVar("--joint"); ctx.fillRect(0, 0, cssW, cssH);
  paintTiles(ctx, f.x, f.y, s, cssW, cssH);

  // 柱脚压在地面上：色块盖住下面的地砖（方位徽标仍画在最上层）
  columnFootprints(scene, state).forEach(r => paintFootprint(ctx, r, s, "柱"));

  // 四条边中点标 前/后/左/右
  const accent = cssVar("--accent");
  const badge = (text, cx, cy) => {
    const bw = 30, bh = 22, r = 6;
    ctx.save();
    ctx.fillStyle = accent;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - bw/2, cy - bh/2, bw, bh, r);
    else ctx.rect(cx - bw/2, cy - bh/2, bw, bh); // 老浏览器兜底
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = '700 13px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, cx, cy + 0.5);
    ctx.restore();
  };
  const inset = 18;
  const mid = {
    top:    [cssW/2, inset],
    bottom: [cssW/2, cssH - inset],
    left:   [inset * 1.2, cssH/2],
    right:  [cssW - inset * 1.2, cssH/2],
  };
  for (const [name, diagramEdge] of Object.entries(f.edges)) {
    const [cx, cy] = mid[diagramEdge];
    badge(EDGE_NAMES[name], cx, cy);
  }
  paintCuts(ctx, f.x, f.y, s, cssW, cssH);

  // 被柱脚裁到的地砖：红字标"缝到柱边"剩余块实测尺寸
  columnFootprints(scene, state).forEach(r => paintFootprintCuts(ctx, r, f.x, f.y, s, cssW, cssH));
}

/* ---- 整屋展开图：在“一张画布”上合成地面 + 四面墙 ----
 * 直接复用底层绘图原语（paintTiles/paintCuts/dashedRect/labelText），都吃显式 scale，
 * 不依赖 setupCanvas，因此和“每面墙单独预览”互不干扰。 */
function paintFloorNet(ctx, card, scene, s, W, H, minG, joint){
  const f = scene.floor;
  ctx.fillStyle = cssVar(joint || "--joint"); ctx.fillRect(0, 0, W, H);
  paintTiles(ctx, f.x, f.y, s, W, H, minG);
}

function paintWallNet(ctx, card, entry, s, W, H){
  if (!entry || !entry.x || !entry.y) return;
  ctx.fillStyle = cssVar("--joint"); ctx.fillRect(0, 0, W, H);
  paintTiles(ctx, entry.x, entry.y, s, W, H);

  const soft = cssVar("--ink-soft");
  if (doorValid(card)) {
    const d = card.door;
    const x = d.left * s, y = (card.h - d.height) * s, w = d.width * s, h = d.height * s;
    ctx.fillStyle = cssVar("--open"); ctx.fillRect(x, y, w, h);
    dashedRect(ctx, x, y, w, h, soft);
  }
  if (winValid(card)) {
    const n = card.win;
    const x = n.left * s, y = (card.h - n.sill - n.height) * s, w = n.width * s, h = n.height * s;
    ctx.fillStyle = cssVar("--open"); ctx.fillRect(x, y, w, h);
    dashedRect(ctx, x, y, w, h, soft);
  }
  publicColsFor(card).forEach((c) => {
    if (!colValid(c, card)) return;
    const x = effLeft(c, card) * s, w = c.width * s, h = card.h * s;
    paintColumnBand(ctx, x, w, h);
  });
}

function renderRoomNet(scene){
  const wrap = $("#roomNetWrap");
  if (!wrap) return;
  const canvas = $("#roomNet"), sub = $("#roomNetSub"), empty = $("#roomNetEmpty");
  const f = scene.floor;
  if (!f || !(f.card.w > 0) || !(f.card.h > 0) || !state.settings.floorTile) {
    canvas.style.display = "none"; empty.style.display = "block";
    sub.textContent = "地面居中，四面墙按“墙地通缝”设定的边围在四周（像把盒子拆开）";
    return;
  }
  const avail = Math.min(wrap.clientWidth || 1000, 1000);
  const net = Engine.computeRoomNet(scene, state, { maxWidth: avail, maxHeight: 1400, margin: 40 });
  if (!net.ok) { canvas.style.display = "none"; empty.style.display = "block"; return; }

  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = net.canvas.w + "px";
  canvas.style.height = net.canvas.h + "px";
  canvas.width = Math.round(net.canvas.w * dpr);
  canvas.height = Math.round(net.canvas.h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, net.canvas.w, net.canvas.h);

  const s = net.scale;
  // 1) 地面（含柱脚色块；展开图不标红字，保持干净）
  ctx.save();
  ctx.translate(net.floor.x, net.floor.y);
  paintFloorNet(ctx, f.card, scene, s, Math.round(net.floor.w), Math.round(net.floor.h));
  columnFootprints(scene, state).forEach(r => paintFootprint(ctx, r, s, null));
  ctx.restore();

  // 2) 四面墙（左/右墙转 90° 合成；推导见注释，保证墙根贴地、不串位）
  net.walls.forEach(wr => {
    const card = state.cards.find(c => c.id === wr.id);
    const entry = scene.walls[wr.id];
    if (!card || !entry) return;
    const Wn = Math.round(card.w * s), Hn = Math.round(card.h * s);
    const tmp = document.createElement("canvas");
    tmp.width = Wn; tmp.height = Hn;
    const tctx = tmp.getContext("2d");
    // 展开图不标裁砖尺寸（手机上看很乱），墙块/门/窗/立柱只画色块
    paintWallNet(tctx, card, entry, s, Wn, Hn);

    ctx.save();
    ctx.translate(wr.x, wr.y);
    if (wr.rot) {
      if (wr.side === "left") {            // 墙根（natural 底边）贴到包围盒右边 = 地面左缘
        ctx.translate(0, wr.h); ctx.rotate(-Math.PI / 2);
      } else {                             // right：墙根贴到包围盒左边 = 地面右缘
        ctx.translate(wr.w, 0); ctx.rotate(Math.PI / 2);
      }
    } else if (wr.side === "back") {
      // 后墙=B墙(有门那面)：测量时人面朝它，左右镜像使门/尺寸左右与实测一致；
      // 同时竖翻让墙根(门所在)贴地面后缘。等效 scale(-1,-1) 即左右+上下都翻。
      ctx.translate(wr.w, wr.h); ctx.scale(-1, -1);
    }
    // front：不旋转也不翻转，墙根天然贴地面前缘
    ctx.drawImage(tmp, 0, 0, Wn, Hn);
    ctx.restore();
  });

  // 3) 每面墙标名字（A/B/C/D），其余字样不显示
  net.walls.forEach(wr => {
    const card = state.cards.find(c => c.id === wr.id);
    if (!card) return;
    const m = /墙\s*([A-Da-d])/.exec(card.name || "");
    const name = m ? (m[1].toUpperCase() + "墙") : (card.name || "");
    let cx, cy;
    if (wr.side === "front")      { cx = wr.x + wr.w/2; cy = wr.y - 12; }
    else if (wr.side === "back")  { cx = wr.x + wr.w/2; cy = wr.y + wr.h + 14; }
    else if (wr.side === "left")  { cx = wr.x - 12;     cy = wr.y + wr.h/2; }
    else /* right */              { cx = wr.x + wr.w + 12; cy = wr.y + wr.h/2; }
    labelText(ctx, name, cx, cy, cssVar("--ink"));
  });
}

/* ============================================================
 * 三维整屋图（纯 Canvas2D 手绘透视，零依赖）
 *   - 把地面/每面墙的砖纹渲染到离屏画布当“贴图”，再贴到 3D 四边形上
 *   - 绕 Y(yaw) + 绕 X(pitch) 转视角，远墙先画、近墙按外法线朝向自动隐藏
 *   - 鼠标拖动旋转、滚轮缩放
 * ============================================================ */
const R3D_FOV = 45 * Math.PI / 180;
const R3D_MIN_GROUT = 2;   // 3D 贴图里砖缝的最小像素宽：缝太窄(亚像素)时把砖内缩，保证肉眼可见
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let R3D = { model: null, cam: null };

/* 离屏渲染一面墙的砖纹（含门/窗/立柱）。尺寸 s 按房间大小自适应，避免画布过大。 */
function buildRoomModel(scene, state){
  const f = scene && scene.floor;
  if (!f || !f.card || !(f.card.w > 0) || !(f.card.h > 0)) return null;
  const FW = f.card.w, FH = f.card.h;
  const ts = Math.min(0.7, 700 / Math.max(FW, FH, 1));   // px / mm

  // 四面墙 side 分配（alignEdge 优先，否则按空位补）：先算，地面阴影和墙都要用
  const used = new Set(); const order = ["front", "back", "left", "right"];
  const sideMap = new Map();
  for (const card of state.cards) {
    if (card.type !== "wall" || !(card.w > 0) || !(card.h > 0)) continue;
    let s = null;
    if (card.alignEdge && card.alignEdge !== "none" && !used.has(card.alignEdge)) { used.add(card.alignEdge); s = card.alignEdge; }
    else { for (const q of order) if (!used.has(q)) { used.add(q); s = q; break; } }
    if (s) sideMap.set(card.id, s);
  }

  // 柱盒落地矩形（角点对齐：和墙上柱色带、柱盒严格同位）→ 地面阴影按它画，
  // 保证任何数据下"柱子坐在阴影里"；2D 地面图/展开图另用居中约定（columnFootprints）
  const shadows = [];
  for (const card of state.cards) {
    if (card.type !== "wall") continue;
    const side = sideMap.get(card.id); if (!side) continue;
    // 仅左墙镜像（与整屋展开图一致）；右墙在展开图里是 rotate(+90°)，本身已把“离左=0”转到前端，
    // 与三维（贴图 u=0 在前端角）方向一致，不能再翻，否则砖缝/立柱相对展开图镜像错位。
    const flip = !!(card.door && card.door.on) || side === "left";
    const across = (side === "front" || side === "back") ? FH : FW;
    card.cols.forEach((c) => {
      if (!colValid(c, card)) return;
      const L = effLeft(c, card);
      const t0 = flip ? Math.max(0, card.w - L - c.width) : L;
      const d = Math.min(c.depth, across * 0.9);
      if (side === "front")      shadows.push({ x:t0, y:0,      w:c.width, h:d });
      else if (side === "back")  shadows.push({ x:t0, y:FH - d, w:c.width, h:d });
      else if (side === "left")  shadows.push({ x:0,      y:t0, w:d, h:c.width });
      else                       shadows.push({ x:FW - d, y:t0, w:d, h:c.width });
    });
  }

  // 地面贴图（柱脚在地面上投一圈落地阴影，比柱脚略大；3D 柱子盒子正好坐在阴影里）
  const floorTex = (() => {
    const Wn = Math.max(1, Math.round(FW * ts)), Hn = Math.max(1, Math.round(FH * ts));
    const c = document.createElement("canvas"); c.width = Wn; c.height = Hn;
    const x = c.getContext("2d");
    paintFloorNet(x, f.card, scene, ts, Wn, Hn, R3D_MIN_GROUT, "--r3d-joint");
    shadows.forEach(r => {
      // 阴影与柱脚面积完全重合（不外扩），俯视即柱脚占地
      x.fillStyle = "rgba(0,0,0,0.22)";
      x.fillRect(r.x * ts, r.y * ts, r.w * ts, r.h * ts);
    });
    return c;
  })();

  // 通缝：把每面墙“贴地面的那条边”的水平相位锁到地面对应边，3D 里墙地砖才对缝
  const st = state.settings;
  const g = st.grout;
  const wDims = st.wallTile ? Engine.laidDims(st.wallTile, st.direction) : null;
  const fDims = st.floorTile ? Engine.laidDims(st.floorTile, st.direction) : null;
  const floorX = scene.floor ? scene.floor.x : null;
  const floorY = scene.floor ? scene.floor.y : null;

  const walls = []; let maxH = 0;
  for (const card of state.cards) {
    if (card.type !== "wall") continue;
    const e = scene.walls && scene.walls[card.id];
    if (!e || !(card.w > 0) || !(card.h > 0)) continue;
    const side = sideMap.get(card.id); if (!side) continue;
    const isDoor = !!(card.door && card.door.on);   // 有门那面墙：与整屋展开图一致，左右镜像
    // 水平相位：前/后墙贴地面“宽”边(floorX)，左/右墙贴“深”边(floorY)
    // 门墙用 (墙长 − 地面相位) 镜像相位，配合纹理水平翻转后墙地砖仍对缝
    // 水平相位：未选“不通缝”(alignEdge==="none") 时，锁到地面对应边相位，使墙地砖对缝；
    // 选了“不通缝”则直接用 computeScene 算好的自由排版 e.x，与整屋展开图保持一致。
    let xLayout = e.x;
    if (wDims && fDims && floorX && floorY && card.alignEdge && card.alignEdge !== "none") {
      const map = (side === "left" || side === "right")
        ? { axis: floorY, dim: fDims.y }
        : { axis: floorX, dim: fDims.x };
      if (Engine.compatible(wDims.x, map.dim)) {
        // 与 computeScene 对齐：左/后墙(贴边反向)镜像相位，前/右方向一致
        const mirror = (card.alignEdge === "left" || card.alignEdge === "back");
        const po = mirror ? (card.w - map.axis.phase) : map.axis.phase;
        xLayout = Engine.layoutAxis(card.w, wDims.x, g, st.startMode, po);
      }
    }
    const tex = (() => {
      const Wn = Math.max(1, Math.round(card.w * ts)), Hn = Math.max(1, Math.round(card.h * ts));
      const c = document.createElement("canvas"); c.width = Wn; c.height = Hn;
      const x = c.getContext("2d");
      x.fillStyle = cssVar("--r3d-joint"); x.fillRect(0, 0, Wn, Hn);
      if (xLayout && e.y) paintTiles(x, xLayout, e.y, ts, Wn, Hn, R3D_MIN_GROUT);
      paintWallFeatures(x, card, ts);
      return c;
    })();
    maxH = Math.max(maxH, card.h);
    // 有效立柱带给 3D：L = 离墙左缘毫米（镜像墙在贴图/几何时统一按 flip 处理）；含相邻墙共享角柱
    const cols = publicColsFor(card).filter(c => colValid(c, card))
      .map(c => ({ L: effLeft(c, card), width: c.width, depth: c.depth }));
    // 水平翻转（纹理/立柱/阴影都按 flip 镜像）：
    //  - 门墙(后)在整屋图里左右镜像，需 flip 与展开图一致；
    //  - 左墙在展开图里 rotate(-90°) 把“离左=0”转到后端，也需 flip；
    //  - 右墙在展开图里 rotate(+90°) 把“离左=0”转到前端，与三维(u=0 在 front 角)方向一致，
    //    不能再翻，否则砖缝、立柱会相对整屋展开图镜像错位（D墙缝对不上）。
    const flip3d = isDoor || side === "left";
    walls.push({ id: card.id, name: card.name, side, tex, w: card.w, h: card.h, flip: flip3d, cols });
  }
  if (!walls.length) return null;
  return { FW, FH, ts, floorTex, walls, maxH, dim: Math.max(FW, FH) };
}

/* 把“纹理三角形”映射到“屏幕三角形”：解出仿射矩阵后裁剪到三角形再贴图。
 * 每个四边形用 N×N 细分，每个子格拆两个三角形，足以近似透视梯形。 */
function drawTri(ctx, tex, pts, tcs){
  const p0 = pts[0], p1 = pts[1], p2 = pts[2];
  const u1 = tcs[0][0], v1 = tcs[0][1], u2 = tcs[1][0], v2 = tcs[1][1], u3 = tcs[2][0], v3 = tcs[2][1];
  const x1 = p0.x, y1 = p0.y, x2 = p1.x, y2 = p1.y, x3 = p2.x, y3 = p2.y;
  const A = u1 - u3, B = v1 - v3, C = x1 - x3, D = u2 - u3, E = v2 - v3, F = x2 - x3;
  const den = A * E - B * D; if (Math.abs(den) < 1e-9) return;
  const a = (C * E - B * F) / den, c = (A * F - C * D) / den, e = x1 - a * u1 - c * v1;
  const b = ((y1 - y3) * E - B * (y2 - y3)) / den, d = (A * (y2 - y3) - (y1 - y3) * D) / den, f = y1 - b * u1 - d * v1;
  const su = Math.min(u1, u2, u3), sv = Math.min(v1, v2, v3);
  const suw = Math.max(u1, u2, u3) - su, suh = Math.max(v1, v2, v3) - sv;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.clip();
  ctx.transform(a, b, c, d, e, f);
  ctx.drawImage(tex, su, sv, suw, suh, su, sv, suw, suh);
  ctx.restore();
}

function lerpQuad(q, u, v){
  const top = { x: q[0].x + (q[1].x - q[0].x) * u, y: q[0].y + (q[1].y - q[0].y) * u };
  const bot = { x: q[3].x + (q[2].x - q[3].x) * u, y: q[3].y + (q[2].y - q[3].y) * u };
  return { x: top.x + (bot.x - top.x) * v, y: top.y + (bot.y - top.y) * v };
}

function drawTexturedQuad(ctx, tex, q, tw, th, bright, flip){
  const N = 8;
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N;
    for (let j = 0; j < N; j++) {
      const v0 = j / N, v1 = (j + 1) / N;
      const sTL = lerpQuad(q, u0, v0), sTR = lerpQuad(q, u1, v0), sBR = lerpQuad(q, u1, v1), sBL = lerpQuad(q, u0, v1);
      // flip：水平镜像（门墙与整屋展开图一致，门左右与实测一致），仅反转 u
      const tu0 = flip ? (1 - u0) : u0, tu1 = flip ? (1 - u1) : u1;
      const su0 = tu0 * tw, su1 = tu1 * tw, su = Math.min(su0, su1), suw = Math.abs(tu1 - tu0) * tw;
      const sv0 = v0 * th, sv1 = v1 * th, sv = Math.min(sv0, sv1), suh = (v1 - v0) * th;
      drawTri(ctx, tex, [sTL, sTR, sBR], [[su0, sv0], [su1, sv0], [su1, sv1]]);
      drawTri(ctx, tex, [sTL, sBR, sBL], [[su0, sv0], [su1, sv1], [su0, sv1]]);
    }
  }
  if (bright < 0.999) {   // 背光面压暗，增强立体感
    ctx.save();
    ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = "rgba(0,0,0," + ((1 - bright) * 0.55) + ")";
    ctx.fillRect(0, 0, 1e7, 1e7);
    ctx.restore();
  }
}

function makeFloorFace(model, project){
  const y = 0, FW = model.FW, FH = model.FH;
  const TL = { x: -FW/2, y, z: -FH/2 }, TR = { x: FW/2, y, z: -FH/2 }, BR = { x: FW/2, y, z: FH/2 }, BL = { x: -FW/2, y, z: FH/2 };
  const sTL = project(TL), sTR = project(TR), sBR = project(BR), sBL = project(BL);
  if (!(sTL.valid && sTR.valid && sBR.valid && sBL.valid)) return null;
  const tex = model.floorTex, tw = tex.width, th = tex.height;
  const depth = (sTL.cz + sTR.cz + sBR.cz + sBL.cz) / 4;
  const bright = clamp(0.6 + 0.4 * 1, 0.4, 1); // 地面朝上，最亮
  return { kind: "floor", tex, tw, th, screen: [sTL, sTR, sBR, sBL],
           center: { x: 0, y: 0, z: 0 }, normal: { x: 0, y: -1, z: 0 }, depth, bright, name: "" };
}

function makeWallFace(wll, model, project){
  const h = wll.h, FW = model.FW, FH = model.FH;
  let corners, normal;
  // 墙左缘对齐到地面对应边起点（-FW/2 或 -FH/2），与通缝锁定的相位起点一致
  if (wll.side === "front") { const z = -FH/2; corners = { TL:{x:-FW/2,y:h,z}, TR:{x:-FW/2+wll.w,y:h,z}, BR:{x:-FW/2+wll.w,y:0,z}, BL:{x:-FW/2,y:0,z} }; normal = { x:0, y:0, z:-1 }; }
  else if (wll.side === "back") { const z = FH/2; corners = { TL:{x:-FW/2,y:h,z}, TR:{x:-FW/2+wll.w,y:h,z}, BR:{x:-FW/2+wll.w,y:0,z}, BL:{x:-FW/2,y:0,z} }; normal = { x:0, y:0, z:1 }; }
  else if (wll.side === "left") { const x = -FW/2; corners = { TL:{x,y:h,z:-FH/2}, TR:{x,y:h,z:-FH/2+wll.w}, BR:{x,y:0,z:-FH/2+wll.w}, BL:{x,y:0,z:-FH/2} }; normal = { x:-1, y:0, z:0 }; }
  else { const x = FW/2; corners = { TL:{x,y:h,z:-FH/2}, TR:{x,y:h,z:-FH/2+wll.w}, BR:{x,y:0,z:-FH/2+wll.w}, BL:{x,y:0,z:-FH/2} }; normal = { x:1, y:0, z:0 }; }
  const sTL = project(corners.TL), sTR = project(corners.TR), sBR = project(corners.BR), sBL = project(corners.BL);
  if (!(sTL.valid && sTR.valid && sBR.valid && sBL.valid)) return null;
  const tex = wll.tex, tw = tex.width, th = tex.height;
  const center = { x: (corners.TL.x + corners.BR.x)/2, y: h/2, z: (corners.TL.z + corners.BR.z)/2 };
  const depth = (sTL.cz + sTR.cz + sBR.cz + sBL.cz) / 4;
  // 可见面是“内法线”那侧；用内法线点光源求亮度
  const inx = -normal.x, iny = -normal.y, inz = -normal.z;
  const bright = clamp(0.5 + 0.5 * Math.max(0, inx*0.3 + iny*1 + inz*0.35), 0.35, 1);
  const topC = { x: (corners.TL.x + corners.TR.x)/2, y: h + 2, z: (corners.TL.z + corners.TR.z)/2 };
  const labelPt = project(topC);
  return { kind: "wall", tex, tw, th, screen: [sTL, sTR, sBR, sBL], center, normal, depth, bright, labelPt, name: wll.name, flip: wll.flip };
}

/* 墙的坐标系：o = 墙左下角(贴地、纹理起点)，u = 墙水平延伸方向，inn = 朝屋内的法线（立柱凸出方向） */
function wallFrame(wll, model){
  const FW = model.FW, FH = model.FH;
  if (wll.side === "front") return { o:{ x:-FW/2, y:0, z:-FH/2 }, u:{ x:1, y:0, z:0 }, inn:{ x:0, y:0, z:1 } };
  if (wll.side === "back")  return { o:{ x:-FW/2, y:0, z: FH/2 }, u:{ x:1, y:0, z:0 }, inn:{ x:0, y:0, z:-1 } };
  if (wll.side === "left")  return { o:{ x:-FW/2, y:0, z:-FH/2 }, u:{ x:0, y:0, z:1 }, inn:{ x:1, y:0, z:0 } };
  return /* right */        { o:{ x: FW/2, y:0, z:-FH/2 }, u:{ x:0, y:0, z:1 }, inn:{ x:-1, y:0, z:0 } };
}

/* 把 #RRGGBB 颜色按亮度系数 f 缩放（<1 变暗），给 3D 柱体的面分明明暗 */
function shadeColor(hex, f){
  const m = /^#([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return hex || "#999";
  const n = parseInt(m[1], 16);
  const ch = (v) => Math.round(clamp(v * f, 0, 255));
  return `rgb(${ch((n >> 16) & 255)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}

/* 包管立柱是"往外凸"的实体盒子：从墙面朝屋里凸出 depth 毫米、通顶。
 * 每根柱子生成 3 个面（正面 + 两个侧面），各带朝屋内的法线，
 * 交给统一的"背向剔除 + 远→近排序"，和墙面一起正确叠放。 */
function makeColumnFaces(wll, model, project){
  const cols = wll.cols;
  if (!cols || !cols.length) return [];
  const fr = wallFrame(wll, model);
  const across = (wll.side === "front" || wll.side === "back") ? model.FH : model.FW;
  const faces = [];
  const h = wll.h;
  cols.forEach((c) => {
    // 镜像墙（门墙）左右翻转：测量的"离左"对应几何上从墙右端算的位置
    const t0 = wll.flip ? Math.max(0, wll.w - c.L - c.width) : c.L;
    const t1 = t0 + c.width;
    const d = Math.min(c.depth, across * 0.9);   // 深不超过房间进深的 90%，防止穿到对面墙外
    const P = (t, y, dd) => ({ x: fr.o.x + fr.u.x * t + fr.inn.x * dd, y, z: fr.o.z + fr.u.z * t + fr.inn.z * dd });
    const mkFace = (pts, rn, k) => {
      const sp = pts.map(project);
      if (!sp.every(p => p.valid)) return;
      const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
      const czm = pts.reduce((a, p) => a + p.z, 0) / pts.length;
      const depth = sp.reduce((a, p) => a + p.cz, 0) / sp.length;
      const bright = clamp(0.66 + 0.34 * Math.max(0, rn.x * 0.3 + rn.y + rn.z * 0.35), 0.5, 1) * k;
      faces.push({ kind:"col", screen:sp, center:{ x:cx, y:cy, z:czm },
        normal:{ x:-rn.x, y:-rn.y, z:-rn.z }, depth, bright });
    };
    mkFace([P(t0,h,d), P(t1,h,d), P(t1,0,d), P(t0,0,d)], fr.inn, 1);                       // 正面（朝屋里）
    mkFace([P(t0,h,0), P(t0,h,d), P(t0,0,d), P(t0,0,0)], { x:-fr.u.x, y:0, z:-fr.u.z }, 0.82); // 侧面（靠墙左端）
    mkFace([P(t1,h,d), P(t1,h,0), P(t1,0,0), P(t1,0,d)], { x: fr.u.x, y:0, z: fr.u.z }, 0.82); // 侧面（靠墙右端）
  });
  return faces;
}

function renderRoom3D(scene){
  const wrap = $("#room3dWrap"); if (!wrap) return;
  R3D.model = buildRoomModel(scene, state);
  if (!R3D.cam) R3D.cam = { yaw: 0.7, pitch: 0.45, dist: null };
  if (R3D.model && R3D.cam.dist == null) R3D.cam.dist = (R3D.model.dim * 0.5) / Math.tan(R3D_FOV / 2) * 1.8;
  renderRoom3DDraw();
}

function renderRoom3DDraw(){
  const wrap = $("#room3dWrap"); if (!wrap) return;
  const canvas = $("#room3d"), empty = $("#room3dEmpty");
  const model = R3D.model;
  if (!model || !model.floorTex) { canvas.style.display = "none"; empty.style.display = "block"; return; }
  empty.style.display = "none"; canvas.style.display = "block";

  const dpr = window.devicePixelRatio || 1;
  const cssW = wrap.clientWidth || 600, cssH = 420;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = cssVar("--card"); ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cam = R3D.cam;
  const T = { x: 0, y: model.maxH * 0.5, z: 0 };
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch), cyaw = Math.cos(cam.yaw), syaw = Math.sin(cam.yaw);
  const camPos = { x: T.x + cam.dist * cp * syaw, y: T.y + cam.dist * sp, z: T.z + cam.dist * cp * cyaw };

  // 相机基向量：forward = 指向目标，right = cross(f, up)，up = cross(right, f)
  let fx = T.x - camPos.x, fy = T.y - camPos.y, fz = T.z - camPos.z;
  const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rxc = -fz, ryc = 0, rzc = fx;
  const rl = Math.hypot(rxc, ryc, rzc) || 1; rxc /= rl; ryc /= rl; rzc /= rl;
  const ux = ryc * fz - rzc * fy, uy = rzc * fx - rxc * fz, uz = rxc * fy - ryc * fx;
  const focal = (canvas.height / 2) / Math.tan(R3D_FOV / 2);
  const CX = canvas.width / 2, CY = canvas.height / 2;
  const project = (p) => {
    const dx = p.x - camPos.x, dy = p.y - camPos.y, dz = p.z - camPos.z;
    const cz = dx * fx + dy * fy + dz * fz;
    const cx = dx * rxc + dy * ryc + dz * rzc;
    const cy = dx * ux + dy * uy + dz * uz;
    return { x: CX + (cx / cz) * focal, y: CY - (cy / cz) * focal, cz, valid: cz > 0.01 };
  };

  const faces = [];
  const ff = makeFloorFace(model, project); if (ff) faces.push(ff);
  const WALL_OUT = { front:{x:0,y:0,z:-1}, back:{x:0,y:0,z:1}, left:{x:-1,y:0,z:0}, right:{x:1,y:0,z:0} };
  model.walls.forEach(wll => {
    const fc = makeWallFace(wll, model, project); if (fc) faces.push(fc);
    // 立柱跟着所属墙走：镜头在这面墙外侧（墙被隐藏）时立柱也一起藏起来，不悬空挡视线
    const fr = wallFrame(wll, model);
    const wc = { x: fr.o.x + fr.u.x * wll.w / 2, y: wll.h / 2, z: fr.o.z + fr.u.z * wll.w / 2 };
    const wn = WALL_OUT[wll.side];
    const facing = wn.x * (camPos.x - wc.x) + wn.y * (camPos.y - wc.y) + wn.z * (camPos.z - wc.z) < 0;
    if (facing) makeColumnFaces(wll, model, project).forEach(cf => faces.push(cf));
  });

  // 近墙（外法线朝向镜头）隐藏，露出屋内——一次主要看 2 面墙，拖动可换角度
  const visible = faces.filter(fc => {
    const c = fc.center;
    const d = fc.normal.x * (camPos.x - c.x) + fc.normal.y * (camPos.y - c.y) + fc.normal.z * (camPos.z - c.z);
    return d < 0;
  });
  visible.sort((a, b) => b.depth - a.depth);  // 远→近

  visible.forEach(fc => {
    if (fc.kind === "col") {
      // 立柱的三个面：纯色 + 明暗区分（正面亮、侧面暗），描边显出凸出的棱
      ctx.beginPath(); ctx.moveTo(fc.screen[0].x, fc.screen[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(fc.screen[i].x, fc.screen[i].y);
      ctx.closePath();
      ctx.fillStyle = shadeColor(cssVar("--column"), fc.bright);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1;
      ctx.stroke();
      return;
    }
    drawTexturedQuad(ctx, fc.tex, fc.screen, fc.tw, fc.th, fc.bright, fc.flip);
    ctx.save();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = Math.max(1, dpr);
    ctx.beginPath(); ctx.moveTo(fc.screen[0].x, fc.screen[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(fc.screen[i].x, fc.screen[i].y);
    ctx.closePath(); ctx.stroke(); ctx.restore();
  });

  // 墙面标 A/B/C/D
  visible.forEach(fc => {
    if (fc.kind !== "wall" || !fc.labelPt.valid) return;
    const m = /墙\s*([A-Da-d])/.exec(fc.name || "");
    const name = m ? (m[1].toUpperCase() + "墙") : (fc.name || "");
    if (!name) return;
    const p = fc.labelPt, r = 11 * dpr;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = '700 ' + (12 * dpr) + 'px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(name, p.x, p.y);
    ctx.restore();
  });
}

/* 拖动旋转 + 滚轮缩放（仅重绘，不重建模型） */
function bindRoom3D(){
  const canvas = $("#room3d"); if (!canvas) return;
  let dragging = false, lastX = 0, lastY = 0;
  const minDist = () => R3D.model ? R3D.model.dim * 0.6 : 100;
  const maxDist = () => R3D.model ? R3D.model.dim * 5 : 5000;
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    R3D.cam.yaw += dx * 0.01;
    R3D.cam.pitch = clamp(R3D.cam.pitch + dy * 0.01, -1.2, 1.2);
    renderRoom3DDraw();
  });
  const end = () => { dragging = false; };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    R3D.cam.dist = clamp(R3D.cam.dist * (1 + e.deltaY * 0.001), minDist(), maxDist());
    renderRoom3DDraw();
  }, { passive: false });
}

/* 调试自检：网址末尾加 #debug 时，把超宽元素列表写进标题和页脚，方便排查手机端适配 */
function debugOverflow(){
  if (location.hash !== "#debug") return;
  const cw = document.documentElement.clientWidth;
  const all = [];
  document.querySelectorAll("body *").forEach(elm => {
    const r = elm.getBoundingClientRect();
    if (r.width > 1) all.push({ w: Math.round(r.width), t: `${elm.tagName}.${String(elm.className).split(" ")[0]}` });
  });
  all.sort((a, b) => b.w - a.w);
  const msg = `cw=${cw} sw=${document.documentElement.scrollWidth} | 最宽: ` + all.slice(0, 6).map(x => `${x.t}=${x.w}`).join(", ");
  document.title = msg;
  const foot = $(".app-foot");
  if (foot) foot.textContent = msg;
}

/* ============================================================
 * 启动
 * ============================================================ */
function boot(){
  bindSettings();
  renderSettings();
  renderCards();
  update();
  hookFeatSync();
  bindRoom3D();
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(update, 150); });
  debugOverflow();
}
document.addEventListener("DOMContentLoaded", boot);
</script>
