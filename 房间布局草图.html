<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1ED">
<title>房间布局草图</title>
<style>
:root{
  --paper:#F2F1ED; --card:#FFFFFF; --ink:#26292E; --ink-soft:#6A6F76;
  --line:#DFDCD4; --chip:#ECEAE4; --accent:#2B5E9B; --accent-soft:#E3EBF5;
  --ok:#2E7D46; --danger:#C0362C; --danger-soft:#F8E4E2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181B; --card:#202226; --ink:#ECEDEF; --ink-soft:#9CA2AA;
    --line:#34373D; --chip:#2A2D32;
    --accent:#7FA9DC; --accent-soft:#243246;
    --ok:#74C28C; --danger:#E5796F; --danger-soft:#3C2320;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:16px; line-height:1.5;}
.wrap{max-width:640px; margin:0 auto; padding:0 14px calc(40px + env(safe-area-inset-bottom));}
header{padding:18px 2px 8px}
header h1{margin:0; font-size:22px; font-weight:800}
header p{margin:4px 0 0; color:var(--ink-soft); font-size:13px}
header p.ver{margin-top:6px; font-size:12px; color:var(--accent); font-weight:700}
header p.diag{margin-top:3px; font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px;}
.card h2{margin:0 0 8px; font-size:16px}
.canvas-wrap{display:flex; justify-content:center; overflow:hidden}
canvas{
  display:block;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  /* 用 outline 代替 border：border 会占掉 1px，让"程序以为的画布大小"
     和"图真正铺的那块区域"差着一丁点，这也是图对不齐的嫌疑之一 */
  outline:1px solid var(--line);
  outline-offset:-1px;
  border:0;
  border-radius:8px;
  cursor:grab;
}
.btn-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation;}
button.primary, button.ghost { min-height:42px; padding:0 14px; border-radius:8px; font-weight:700; font-size:14px; flex:1; }
button.primary{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);}
button.ghost{background:var(--chip); color:var(--ink); border:1px solid var(--line);}
button:active{transform:translateY(1px)}
.hint{margin:10px 0 0; font-size:13px; color:var(--ink-soft); text-align:center}
.field{display:block; margin-bottom:8px}
.field>span{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:3px}
input{width:100%; min-height:42px; padding:8px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--ink); font:inherit; font-variant-numeric:tabular-nums;}
input:focus{outline:2px solid var(--accent); border-color:var(--accent)}
.dim-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.room-line{display:block; padding:8px 10px; margin-top:6px; border:1px solid var(--line); border-radius:8px;
  font-size:13px; font-variant-numeric:tabular-nums; cursor:pointer}
.room-line.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:700}
.room-line.empty{border-style:dashed; color:var(--ink-soft); cursor:default}
.room-line.far{border-color:var(--danger); background:var(--danger-soft); color:var(--danger); font-weight:700}
.ok-banner{margin-top:10px; padding:10px 12px; background:#E4F0E7; color:var(--ok);
  border-radius:8px; font-size:13px; font-weight:700; text-align:center}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ok-banner{background:#1F3327;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>房间布局草图</h1>
    <p>拖拽摆放房间、填上长宽，一键导出给 house.html</p >
    <p class="ver" id="ver"></p>
    <p class="diag" id="diag"></p>
  </header>

  <section class="card">
    <div class="canvas-wrap"><canvas id="cv"></canvas></div>
    <p class="hint" id="hint">点下面「＋ 添加房间」开始</p >
    <div class="btn-row">
      <button class="primary" id="add">＋ 添加房间</button>
      <button class="ghost" id="fit">适应画面</button>
      <button class="ghost" id="zin">＋ 放大</button>
      <button class="ghost" id="zout">－ 缩小</button>
      <button class="ghost" id="clear">清空</button>
    </div>
  </section>

  <section class="card">
    <h2>房间之间留多大缝</h2>
    <label class="field"><span>间隙</span>
      <select id="gapMode">
        <option value="wall">留一个墙厚（两间房之间有墙）</option>
        <option value="zero">贴死 · 间隙 0（两间房连通，中间没墙）</option>
      </select>
    </label>
    <div id="wallBox">
      <label class="field"><span>墙厚（mm）</span>
        <select id="wallPreset">
          <option value="100">100（薄隔墙）</option>
          <option value="120">120（薄隔墙）</option>
          <option value="200">200（加气块）</option>
          <option value="240" selected>240（一砖墙）</option>
          <option value="370">370（一砖半）</option>
          <option value="custom">自己填…</option>
        </select>
      </label>
      <label class="field" id="wallCustomBox" style="display:none">
        <span>自己填墙厚（mm）</span>
        <input type="text" inputmode="numeric" id="wallCustom" placeholder="240">
      </label>
    </div>
  </section>

  <section class="card" id="editor" style="display:none">
    <h2>选中房间</h2>
    <label class="field"><span>名称</span><input type="text" id="rName"></label>
    <div class="dim-grid">
      <label class="field"><span>长（mm）</span><input type="text" inputmode="numeric" id="rW"></label>
      <label class="field"><span>宽（mm）</span><input type="text" inputmode="numeric" id="rH"></label>
    </div>
    <div class="btn-row">
      <button class="ghost" id="del" style="color:var(--danger)">删除这间</button>
    </div>
  </section>

  <section class="card">
    <h2>房间清单</h2>
    <div id="roomList"></div>
    <p class="hint" style="text-align:left">点一行就选中那间房。要是哪间的坐标离得特别远，画面会被它撑得很大——改掉数字就行。</p>
  </section>

  <section class="card">
    <button class="primary" id="apply" style="width:100%">应用到 house.html</button>
    <div class="ok-banner" id="ok" style="display:none">已写入！打开 house.html 就能看到。</div>
  </section>
</div>

<script>
const BUILD = "2026-09-16 20:52";  // 版本号：手机上看看对不对，就知道是不是旧页面了

const STORE_KEY = "houseTileV1";   // house.html 的存档（导出时往这里写）
const SKETCH_KEY = "houseSketchV1"; // 草图自己的存档（和 house.html 分开，互不干扰）
const WALL_DEFAULT = 240;        // 默认墙厚（mm），界面上可以改成 0 或别的值
const SNAP_GRID = 100;           // 网格吸附（mm）
const SNAP_ROOM = 500;           // 房间吸附触发距离（mm）
const HIT_SLOP_PX = 12;          // 手指命中半径（屏幕像素）
const DRAG_THRESHOLD_PX = 8;     // 拖动触发阈值（屏幕像素）


const canvas = document.getElementById("cv");
const $ = (s) => document.querySelector(s);

const state = {
  seq: 0,
  rooms: [],          // { id, name, x, y, w, h }
  selected: null,
  view: null,         // { scale, offsetX, offsetY }
  pending: null,      // 交互中状态
  gapMode: "wall",    // "wall" = 房间之间留一个墙厚；"zero" = 贴死，间隙 0（两间连通）
  wall: WALL_DEFAULT, // 墙厚（mm）
  manualView: false,  // 用户自己拖过/缩放过画布 → 不再自动扶正，尊重手动位置
};
/* 当前该留多大缝：贴死模式就是 0 */
const gapMM = () => (state.gapMode === "zero" ? 0 : Math.max(0, Number(state.wall) || 0));

/* ---------- 草图存档（刷新不丢）---------- */
function saveSketch() {
  try {
    localStorage.setItem(SKETCH_KEY, JSON.stringify({
      seq: state.seq, rooms: state.rooms, gapMode: state.gapMode, wall: state.wall,
    }));
  } catch (e) {}
}
let _saveTimer = null;
const saveSoon = () => { clearTimeout(_saveTimer); _saveTimer = setTimeout(saveSketch, 300); };

function loadSketch() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SKETCH_KEY) || "null"); } catch (e) {}
  if (!d || !Array.isArray(d.rooms)) return;
  const ok = d.rooms.filter((r) => r && typeof r.id === "string" &&
    [r.x, r.y, r.w, r.h].every((v) => typeof v === "number" && isFinite(v)) && r.w > 0 && r.h > 0);
  if (!ok.length) return;
  state.rooms = ok.map((r) => ({ id: r.id, name: r.name || "房间", x: r.x, y: r.y, w: r.w, h: r.h }));
  // 编号接着已有的往下排，免得新加的房间 id 跟旧的重号
  const nums = state.rooms.map((r) => parseInt(String(r.id).replace(/\D/g, ""), 10)).filter((n) => isFinite(n));
  state.seq = Math.max(Number(d.seq) || 0, ...nums, 0);
  if (d.gapMode === "zero" || d.gapMode === "wall") state.gapMode = d.gapMode;
  if (typeof d.wall === "number" && isFinite(d.wall) && d.wall >= 0) state.wall = d.wall;
}

/* ---------- 坐标转换 ---------- */
function bbox(rooms) {
  if (!rooms.length) return null;
  const x0 = Math.min(...rooms.map(r => r.x));
  const y0 = Math.min(...rooms.map(r => r.y));
  const x1 = Math.max(...rooms.map(r => r.x + r.w));
  const y1 = Math.max(...rooms.map(r => r.y + r.h));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* 适应画面：让全部房间刚好装进画布，四周各留 6% 空白，并把画面中心对准户型中心。
 * （原来是固定留 800mm，户型小的时候留白占比过大，图会缩得看不清） */
function computeView(cssW, cssH) {
  if (!state.rooms.length) return { scale:0.05, offsetX:-1000, offsetY:-1000, forW:cssW, forH:cssH };
  const bb = bbox(state.rooms);
  const margin = 0.06;
  const availW = cssW * (1 - margin * 2), availH = cssH * (1 - margin * 2);
  let scale = Math.min(availW / bb.w, availH / bb.h);
  scale = Math.max(0.005, Math.min(scale, 0.3));
  // forW/forH：记下这份视图是为多大的画布算的。画布一变（旋屏、键盘弹出、首帧排版迟了），
  // 原来的居中就作废了，draw() 看到尺寸对不上会重算，图就不会歪在一边。
  return {
    scale, forW: cssW, forH: cssH,
    offsetX: bb.x + bb.w / 2 - (cssW / scale) / 2,
    offsetY: bb.y + bb.h / 2 - (cssH / scale) / 2,
  };
}

function toMM(e) {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const { scale, offsetX, offsetY } = state.view;
  return { x: px / scale + offsetX, y: py / scale + offsetY };
}

/* 命中检测：带手指半径外扩 */
function hitTest(mx, my, slopMM) {
  const slop = slopMM || 0;
  for (let i = state.rooms.length - 1; i >= 0; i--) {
    const r = state.rooms[i];
    if (mx >= r.x - slop && mx <= r.x + r.w + slop &&
        my >= r.y - slop && my <= r.y + r.h + slop) return r;
  }
  return null;
}

/* 居中自检：只要用户没自己挪过画布，发现图偏了就把它扶正。
 * 真机上画布尺寸可能被各种东西带偏（地址栏、边框、缩放），这道保险兜住。 */
let _offDx = 0, _offDy = 0;      // 最近一次扶正是往哪个方向挪的（排查用）
function recenterIfNeeded(boxW, boxH) {
  const v = state.view;
  if (state.manualView || !v || !state.rooms.length) return 0;
  const bb = bbox(state.rooms);
  if (!(bb.w > 0 && bb.h > 0)) return 0;
  const cx = (bb.x + bb.w / 2 - v.offsetX) * v.scale;
  const cy = (bb.y + bb.h / 2 - v.offsetY) * v.scale;
  const dx = boxW / 2 - cx, dy = boxH / 2 - cy;   // dy>0：内容偏上；dx>0：内容偏左
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return 0;
  v.offsetX -= dx / v.scale;
  v.offsetY -= dy / v.scale;
  _offDx = dx; _offDy = dy;
  return Math.hypot(dx, dy);
}

/* 找出「跑丢的房间」：户型框里大部分是空地，说明有一间被拖到很远的地方，
 * 它把画面撑得老大，剩下的房间就挤成一小条了。返回离大伙最远的那间。 */
function farRoom() {
  if (state.rooms.length < 2) return null;
  const bb = bbox(state.rooms);
  const sumArea = state.rooms.reduce((a, r) => a + r.w * r.h, 0);
  if (!(bb.w > 0 && bb.h > 0) || bb.w * bb.h <= sumArea * 8) return null;  // 还算紧凑
  let worst = null, worstD = -1;
  state.rooms.forEach((r) => {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    let minD = Infinity;
    state.rooms.forEach((o) => {
      if (o === r) return;
      minD = Math.min(minD, Math.hypot(cx - (o.x + o.w / 2), cy - (o.y + o.h / 2)));
    });
    if (minD > worstD) { worstD = minD; worst = r; }
  });
  return worst;
}

/* 有没有房间跑到画布外面去了（有就说明视野该重算了） */
function anyRoomOutside() {
  if (!state.view) return false;
  const { w: cw, h: ch } = canvasCssSize();
  const { scale, offsetX, offsetY } = state.view;
  return state.rooms.some((r) => {
    if (!(r.w > 0 && r.h > 0)) return false;
    const l = (r.x - offsetX) * scale, t = (r.y - offsetY) * scale;
    const rr = (r.x + r.w - offsetX) * scale, bb = (r.y + r.h - offsetY) * scale;
    return l < -1 || t < -1 || rr > cw + 1 || bb > ch + 1;
  });
}

/* ---------- 吸附 ---------- */
function snapToRooms(x, y, w, h, exclude) {
  let bestX = x, bestY = y;
  let bestDx = SNAP_ROOM, bestDy = SNAP_ROOM;
  const g = gapMM();          // 贴死模式就是 0，两间房直接挨上
  for (const o of state.rooms) {
    if (o === exclude) continue;
    const candsX = [
      o.x + o.w + g,     // 我在它右边，中间留 g
      o.x - g - w,       // 我在它左边，中间留 g
      o.x,               // 两边左对齐
      o.x + o.w - w,     // 两边右对齐
    ];
    for (const c of candsX) {
      const d = Math.abs(x - c);
      if (d < bestDx) { bestDx = d; bestX = c; }
    }
    const candsY = [
      o.y + o.h + g,
      o.y - g - h,
      o.y,
      o.y + o.h - h,
    ];
    for (const c of candsY) {
      const d = Math.abs(y - c);
      if (d < bestDy) { bestDy = d; bestY = c; }
    }
  }
  return { x: bestDx < SNAP_ROOM ? bestX : x, y: bestDy < SNAP_ROOM ? bestY : y };
}

/* ---------- 绘制 ---------- */
const getCSS = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function draw() {
  const dpr = window.devicePixelRatio || 1;
  // 画布最小给它 160px：容器宽度偶尔会算成 0（页面还没排好时），减 8 就成了负数
  const cssW = Math.max(160, (canvas.parentElement.clientWidth || 0) - 8);
  // 手机上有地址栏，innerHeight 会把地址栏算进去，量出来偏大；visualViewport 才是真正看得见的高度
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 800;
  const cssH = Math.max(280, Math.min(vh * 0.5, 470));   // 留点余地，好让画布一屏装得下
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";

  /* 设完尺寸再量一次真实显示区（内容盒，不含 1px 边框）：
   * 位图就是铺在这块区域上的，视图必须按它来算，否则内容会整体偏上/偏下。 */
  const boxW = canvas.clientWidth || cssW;
  const boxH = canvas.clientHeight || cssH;
  canvas.width = Math.round(boxW * dpr);
  canvas.height = Math.round(boxH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = getCSS("--paper");
  ctx.fillRect(0, 0, boxW, boxH);

  // 画布尺寸变了这份视图就作废（旋屏、手机键盘弹出、首帧排版迟了），重新居中
  if (!state.view || state.view.forW !== boxW || state.view.forH !== boxH)
    state.view = computeView(boxW, boxH);
  const offPx = recenterIfNeeded(boxW, boxH);   // 偏了就这一帧扶正
  const { scale, offsetX, offsetY } = state.view;
  const px = (mm) => (mm - offsetX) * scale;

  // 网格
  let step = 1000;
  while (step * scale < 22) step *= 2;
  ctx.strokeStyle = "rgba(120,120,120,0.10)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const x0 = Math.floor(offsetX / step) * step;
  const y0 = Math.floor(offsetY / step) * step;
  const x1 = offsetX + boxW / scale, y1 = offsetY + boxH / scale;
  for (let x = x0; x <= x1; x += step) {
    const p = px(x); ctx.moveTo(p, 0); ctx.lineTo(p, boxH);
  }
  for (let y = y0; y <= y1; y += step) {
    const p = (y - offsetY) * scale; ctx.moveTo(0, p); ctx.lineTo(boxW, p);
  }
  ctx.stroke();

  // 房间
  state.rooms.forEach((r) => {
    const X = px(r.x), Y = px(r.y);
    const W = r.w * scale, H = r.h * scale;
    const sel = r === state.selected;
    const dragging = state.pending && state.pending.room === r && state.pending.moved;

    if (dragging) {
      ctx.save();
      ctx.shadowColor = "rgba(43,94,155,0.45)";
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 4;
    }
    
    ctx.fillStyle = sel ? "rgba(43,94,155,0.30)" : "rgba(43,94,155,0.13)";
    ctx.fillRect(X, Y, W, H);
    ctx.strokeStyle = sel ? "#2B5E9B" : "rgba(43,94,155,0.55)";
    ctx.lineWidth = sel ? 2.5 : 1.5;
    ctx.strokeRect(X, Y, W, H);
    
    if (dragging) ctx.restore();
    
    if (W > 55 && H > 26) {
      ctx.fillStyle = "#1B3D6B";
      ctx.font = "700 13px -apple-system, PingFang SC, sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(r.name, X + 6, Y + 6);
      if (W > 90 && H > 48) {
        ctx.font = "600 11px -apple-system, PingFang SC, sans-serif";
        ctx.fillText(`${Math.round(r.w)}×${Math.round(r.h)}`, X + 6, Y + 24);
      }
    }
  });

  if (!state.rooms.length) {
    ctx.fillStyle = getCSS("--ink-soft");
    ctx.font = "14px -apple-system, PingFang SC, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("点下面「＋ 添加房间」开始", boxW / 2, boxH / 2);
    ctx.textAlign = "start";
  }

  // 光标
  canvas.style.cursor = (state.pending && (state.pending.room || state.pending.mode === "pan")) ? "grabbing"
                       : (state.rooms.length ? "grab" : "default");

  $("#hint").textContent = state.rooms.length
    ? ("空白处拖动画布 · 滚轮或「＋ －」缩放 · 乱了就点「适应画面」复位"
       + (state.gapMode === "zero" ? " · 房间靠近时直接贴上去（间隙 0）"
                                   : ` · 房间靠近时自动留 ${state.wall}mm 墙`))
    : "点下面「＋ 添加房间」开始";
  renderRoomList();
  // 版本行顺带报一下居中情况（排查用：扶正了多少、往哪边偏的）
  if (offPx > 0.5 || _offDx || _offDy) {
    const dir = [];
    if (Math.abs(_offDy) >= 1) dir.push(_offDy > 0 ? `内容偏上 ${Math.abs(_offDy).toFixed(0)}px` : `内容偏下 ${Math.abs(_offDy).toFixed(0)}px`);
    if (Math.abs(_offDx) >= 1) dir.push(_offDx > 0 ? `偏左 ${Math.abs(_offDx).toFixed(0)}px` : `偏右 ${Math.abs(_offDx).toFixed(0)}px`);
    $("#ver").textContent = "版本 " + BUILD + "　（已自动扶正：" + (dir.join("，") || "居中") + "）";
  }
  // 诊断行：把画布尺寸和内容中心都摆出来，真机上对不上一眼就能看出来
  const bbD = state.rooms.length ? bbox(state.rooms) : null;
  if (bbD) {
    const cx0 = (bbD.x + bbD.w / 2 - state.view.offsetX) * state.view.scale;
    const cy0 = (bbD.y + bbD.h / 2 - state.view.offsetY) * state.view.scale;
    const top = (bbD.y - state.view.offsetY) * state.view.scale;
    const bot = (bbD.y + bbD.h - state.view.offsetY) * state.view.scale;
    $("#diag").textContent =
      `画布 ${Math.round(boxW)}×${Math.round(boxH)}　户型 ${Math.round(bbD.w)}×${Math.round(bbD.h)}mm`
      + `　图上 y ${Math.round(top)}~${Math.round(bot)}`
      + `　中心 ${Math.round(cy0)}/${Math.round(boxH / 2)}（内容/画布）`
      + `　横 ${Math.round(cx0)}/${Math.round(boxW / 2)}`;
  } else {
    $("#diag").textContent = `画布 ${Math.round(boxW)}×${Math.round(boxH)}　位图 ${canvas.width}×${canvas.height}　dpr ${dpr}`;
  }
}

/* ---------- 触摸/指针交互 ---------- */
canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

  const b = canvas.getBoundingClientRect();
  const px0 = e.clientX - b.left, py0 = e.clientY - b.top;
  const { x, y } = toMM(e);
  const slopMM = HIT_SLOP_PX / state.view.scale;
  const hit = hitTest(x, y, slopMM);

  // 立刻高亮，给视觉反馈
  state.selected = hit || null;
  renderEditor();
  draw();
  if (hit && navigator.vibrate) { try { navigator.vibrate(6); } catch (err) {} }

  // 按住房间＝挪这一间；按住空白处＝挪整张画布
  state.pending = hit
    ? { mode:"room", room:hit, sx:x, sy:y, rx:hit.x, ry:hit.y,
        moved:false, startTime:Date.now(), pointerId:e.pointerId }
    : { mode:"pan", room:null, px:px0, py:py0, ox:state.view.offsetX, oy:state.view.offsetY,
        moved:false, startTime:Date.now(), pointerId:e.pointerId };
});

canvas.addEventListener("pointermove", (e) => {
  const p = state.pending;
  if (!p) return;
  e.preventDefault();

  // 拖画布：图跟着手指走，位置随你摆
  if (p.mode === "pan") {
    const b = canvas.getBoundingClientRect();
    const dxPx = (e.clientX - b.left) - p.px;
    const dyPx = (e.clientY - b.top) - p.py;
    if (!p.moved && Math.hypot(dxPx, dyPx) < DRAG_THRESHOLD_PX) return;
    p.moved = true;
    state.manualView = true;              // 自己挪过的，就别再自动扶正了
    state.view.offsetX = p.ox - dxPx / state.view.scale;
    state.view.offsetY = p.oy - dyPx / state.view.scale;
    draw();
    return;
  }

  if (!p.room) return;
  const { x, y } = toMM(e);
  const dx = x - p.sx;
  const dy = y - p.sy;
  const distPx = Math.hypot(dx, dy) * state.view.scale;

  // 没超过阈值：还在"试探阶段"，不移动
  if (!p.moved && distPx < DRAG_THRESHOLD_PX) return;
  p.moved = true;

  let nx = p.rx + dx;
  let ny = p.ry + dy;
  nx = Math.round(nx / SNAP_GRID) * SNAP_GRID;
  ny = Math.round(ny / SNAP_GRID) * SNAP_GRID;
  const sn = snapToRooms(nx, ny, p.room.w, p.room.h, p.room);
  p.room.x = sn.x;
  p.room.y = sn.y;
  draw();
});

/* ---------- 缩放：滚轮（电脑）/ ＋－按钮（手机），以手指那个点为锚 ---------- */
function canvasCssSize() {
  return { w: canvas.clientWidth || parseFloat(canvas.style.width) || 0,
           h: canvas.clientHeight || parseFloat(canvas.style.height) || 0 };
}
function zoomAt(factor, cxPx, cyPx) {
  state.manualView = true;               // 自己缩放过的，也别自动扶正
  const v = state.view;
  const mmX = cxPx / v.scale + v.offsetX;      // 锚点现在是哪个毫米位置
  const mmY = cyPx / v.scale + v.offsetY;
  const ns = Math.max(0.002, Math.min(v.scale * factor, 2));
  v.scale = ns;
  v.offsetX = mmX - cxPx / ns;                 // 缩完之后，这个点还停在原处
  v.offsetY = mmY - cyPx / ns;
  draw();
}
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const b = canvas.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - b.left, e.clientY - b.top);
}, { passive: false });
$("#zin").onclick  = () => { const s = canvasCssSize(); zoomAt(1.25, s.w / 2, s.h / 2); };
$("#zout").onclick = () => { const s = canvasCssSize(); zoomAt(1 / 1.25, s.w / 2, s.h / 2); };

function endPointer(e) {
  const p = state.pending;
  state.pending = null;
  if (!p) { draw(); return; }

  // 长按未移动 → 滚到编辑面板并聚焦（手机上调数值方便）
  if (!p.moved && p.room && Date.now() - p.startTime > 350) {
    const ed = document.getElementById("editor");
    if (ed && ed.style.display !== "none") {
      ed.scrollIntoView({ behavior: "smooth", block: "nearest" });
      setTimeout(() => { const n = document.getElementById("rName"); if (n) n.focus(); }, 250);
    }
  }

  // ★ 视图冻结：只在房间被拖出屏幕外时才重算
  if (p.moved && p.room) {
    saveSketch();          // 拖动结束就存一份，刷新不丢
    if (anyRoomOutside()) state.view = null;   // 拖出画面了就自动收回来
  }
  draw();
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

/* ---------- 编辑面板 ---------- */
function renderEditor() {
  const box = $("#editor");
  if (!state.selected) { box.style.display = "none"; return; }
  box.style.display = "";
  $("#rName").value = state.selected.name;
  $("#rW").value = state.selected.w;
  $("#rH").value = state.selected.h;
}

/* ---------- 房间清单：一眼看出有没有房间跑到很远的地方 ---------- */
let _listKey = "";
function renderRoomList() {
  const box = $("#roomList");
  if (!box) return;
  const key = JSON.stringify(state.rooms.map((r) => [r.name, Math.round(r.x), Math.round(r.y),
    Math.round(r.w), Math.round(r.h), r === state.selected]));
  if (key === _listKey) return;        // 没变化就不重建（拖动时每帧都会走一次 draw）
  _listKey = key;
  box.innerHTML = "";
  if (!state.rooms.length) {
    const d = document.createElement("div");
    d.className = "room-line empty";
    d.textContent = "还没有房间，点上面「＋ 添加房间」";
    box.appendChild(d);
    return;
  }
  const far = farRoom();
  state.rooms.forEach((r) => {
    const d = document.createElement("div");
    d.className = "room-line" + (r === state.selected ? " on" : "") + (r === far ? " far" : "");
    d.textContent = `${r.name}　x ${Math.round(r.x)}　y ${Math.round(r.y)}　${Math.round(r.w)}×${Math.round(r.h)}`
      + (r === far ? "　← 这间离得太远，把画面撑小了" : "");
    d.onclick = () => { state.selected = r; renderEditor(); draw(); };
    box.appendChild(d);
  });
}

$("#rName").addEventListener("input", (e) => {
  if (state.selected) { state.selected.name = e.target.value; draw(); saveSoon(); }
});
$("#rW").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10);
  if (state.selected && v > 0) { state.selected.w = v; draw(); if (anyRoomOutside()) { state.view = null; draw(); } saveSoon(); }
});
$("#rH").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10);
  if (state.selected && v > 0) { state.selected.h = v; draw(); if (anyRoomOutside()) { state.view = null; draw(); } saveSoon(); }
});
$("#del").onclick = () => {
  if (!state.selected) return;
  state.rooms = state.rooms.filter(r => r !== state.selected);
  state.selected = null;
  state.view = null;   // 少了一间，视野重新收拾一遍
  saveSketch();
  draw(); renderEditor();
};

/* ---------- 工具栏 ---------- */
$("#add").onclick = () => {
  const bb = bbox(state.rooms);
  let x = 0, y = 0;
  if (bb) { x = bb.x + bb.w + gapMM(); y = bb.y; }
  const r = {
    id: "r" + (++state.seq),
    name: "房间" + (state.rooms.length + 1),
    x, y, w: 3000, h: 3000,
  };
  state.rooms.push(r);
  state.selected = r;
  state.view = null;   // 新房间加进来，重算视野
  saveSketch();
  draw(); renderEditor();
};

/* ---------- 间隙 / 墙厚 ---------- */
const WALL_PRESETS = [100, 120, 200, 240, 370];
function syncWallUI() {
  const isPreset = WALL_PRESETS.indexOf(state.wall) >= 0;
  $("#gapMode").value = state.gapMode;
  $("#wallBox").style.display = state.gapMode === "zero" ? "none" : "";
  $("#wallPreset").value = isPreset ? String(state.wall) : "custom";
  $("#wallCustomBox").style.display = isPreset ? "none" : "";
  if (!isPreset) $("#wallCustom").value = state.wall;
}
$("#gapMode").addEventListener("change", (e) => {
  state.gapMode = e.target.value === "zero" ? "zero" : "wall";
  saveSketch(); syncWallUI(); draw();
});
$("#wallPreset").addEventListener("change", (e) => {
  if (e.target.value === "custom") {   // 选了「自己填」：露出输入框，等他填
    $("#wallCustomBox").style.display = "";
    $("#wallCustom").focus();
    return;
  }
  state.wall = parseInt(e.target.value, 10) || 0;
  saveSketch(); syncWallUI(); draw();
});
$("#wallCustom").addEventListener("input", (e) => {
  const v = parseInt(e.target.value, 10);
  if (isFinite(v) && v >= 0) { state.wall = v; saveSoon(); draw(); }
});

/* 适应画面：连画两帧。第一帧可能刚把画布尺寸改了（比如首帧排版），
 * 第二帧按稳定下来的尺寸重新居中，图就一定是正的。 */
$("#fit").onclick = () => {
  state.manualView = false;              // 交回自动扶正
  state.view = null; draw(); state.view = null; draw();
  // 顺手把画布挪到屏幕正中：手机上画布比一屏高一点，不滚的话顶上那截看不见
  try { canvas.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
};
$("#clear").onclick = () => {
  if (!confirm("清空所有房间？")) return;
  state.rooms = []; state.selected = null; state.view = null; state.pending = null;
  saveSketch();      // 清空也要存，免得刷新又冒出来
  draw(); renderEditor();
};

/* ---------- 导出 ---------- */
/* 看看 house.html 里现在存着什么（好告诉用户会被改成啥样） */
function readHouse() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (d && Array.isArray(d.rooms)) return d;
  } catch (e) {}
  return null;
}
/* 草图里有没有房间叠在一起（叠了的话 house.html 会报「重叠」出不了图） */
function overlapNames(rooms) {
  const out = [];
  for (let i = 0; i < rooms.length; i++) for (let j = i + 1; j < rooms.length; j++) {
    const a = rooms[i], b = rooms[j];
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 0 && oy > 0) out.push(`${a.name || "房间"} × ${b.name || "房间"}`);
  }
  return out;
}

$("#apply").onclick = () => {
  if (!state.rooms.length) { alert("先加几间房"); return; }

  // 先把后果说清楚：几间房被换掉、几道门会被清掉
  const house = readHouse();
  const nR = house ? house.rooms.length : 0;
  const nD = house && Array.isArray(house.doors) ? house.doors.length : 0;
  const gapTxt = state.gapMode === "zero" ? "贴死（间隙 0）" : `留墙厚 ${state.wall}mm`;
  const L = [`草图里有 ${state.rooms.length} 间房，要写进 house.html。`,
             `房间之间：${gapTxt}，这个设置会一起带过去。`];
  if (nR || nD) {
    L.push("", `house.html 现在存着 ${nR} 间房、${nD} 道门。应用之后：`);
    if (nR) L.push(`· 那 ${nR} 间房 → 换成草图这 ${state.rooms.length} 间`);
    if (nD) L.push(`· 那 ${nD} 道门 → 全部清掉，门洞得回 house.html 重设`);
    L.push("", "这一步写下去就撤不回来了。");
  } else {
    L.push("", "house.html 里还没排过户型，写进去不会覆盖别的东西。");
  }
  const ov = overlapNames(state.rooms);
  if (ov.length) L.push("", `⚠ 草图里有房间叠在一起（${ov.join("、")}），写进去 house.html 会报「重叠」、出不了图。`);
  if (!confirm(L.join("\n") + "\n\n确定应用吗？")) return;

  const minX = Math.min(...state.rooms.map(r => r.x));
  const minY = Math.min(...state.rooms.map(r => r.y));
  const rooms = state.rooms.map((r, i) => ({
    id: "r" + (i + 1),
    name: r.name,
    x: Math.round(r.x - minX),
    y: Math.round(r.y - minY),
    w: Math.round(r.w),
    h: Math.round(r.h),
  }));
  let existing = null;
  try { existing = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  const data = {
    // 保留 house.html 原来的设置（砖规格、起铺基准那些），只把墙厚换成草图现在这个值
    settings: Object.assign({
      floorTile: null, direction: "horizontal", grout: 2,
      baseRoom: null, baseMode: "center", nudgeX: 0, nudgeY: 0, showCuts: false, wall: 240,
    }, (existing && existing.settings) || {}, { wall: gapMM() }),
    seq: 100, rooms, doors: [],
  };
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    $("#ok").style.display = "";
    setTimeout(() => { $("#ok").style.display = "none"; }, 2500);
  } catch (e) { alert("写入失败：" + e.message); }
};

window.addEventListener("resize", () => { state.view = null; draw(); });
loadSketch();          // 打开就接着上次的户型继续摆
syncWallUI();
$("#ver").textContent = "版本 " + BUILD;
draw(); renderEditor();
</script>
</body>
</html>
